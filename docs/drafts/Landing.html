  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

p.price}<\u002Fstrong>por visita<\u002Fdiv>\n            <button class=\"provider-book\" onclick=\"bookPro('${p.name.replace(/'/g, \"\")}')\">Reservar<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>`;\n    }\n\n    const listEl = document.getElementById('providerList');\n    const noResEl = document.getElementById('noResults');\n    const countEl = document.getElementById('resultCount');\n    const svcLabelEl = document.getElementById('resultSvc');\n    const svcSel = document.getElementById('svc');\n    const locInput = document.getElementById('loc');\n    const sortSel = document.getElementById('sortSel');\n\n    function currentSorted(list) {\n      const arr = [...list];\n      const mode = sortSel.value;\n      if (mode.startsWith('Precio')) arr.sort((a,b) => a.price - b.price);\n      else if (mode.startsWith('Más cercanos')) arr.sort((a,b) => a.dist - b.dist);\n      else if (mode.startsWith('Más reseñas')) arr.sort((a,b) => b.reviews - a.reviews);\n      else arr.sort((a,b) => b.rating - a.rating);\n      return arr;\n    }\n\n    function render() {\n      const svc = svcSel.value;\n      let list = svc ? PROVIDERS.filter(p => p.svc === svc) : PROVIDERS;\n      list = currentSorted(list);\n\n      if (list.length === 0) {\n        listEl.innerHTML = '';\n        noResEl.style.display = 'block';\n      } else {\n        noResEl.style.display = 'none';\n        listEl.innerHTML = list.map(cardHTML).join('');\n      }\n\n      const loc = locInput.value.trim() || 'tu zona';\n      svcLabelEl.textContent = svc ? 'de ' + NAMES[svc].toLowerCase() : 'disponibles';\n      countEl.textContent = `${list.length} profesional${list.length === 1 ? '' : 'es'} verificado${list.length === 1 ? '' : 's'} en ${loc}`;\n    }\n\n    function doSearch(scroll) {\n      render();\n      if (scroll) {\n        const top = document.getElementById('resultados').getBoundingClientRect().top + window.scrollY - 80;\n        window.scrollTo({ top, behavior: 'smooth' });\n      }\n    }\n\n    document.getElementById('searchBtn').addEventListener('click', () => doSearch(true));\n    svcSel.addEventListener('change', () => render());\n    sortSel.addEventListener('change', () => render());\n    locInput.addEventListener('input', () => render());\n\n    document.querySelectorAll('.hero-chip').forEach(chip => {\n      chip.addEventListener('click', () => { svcSel.value = chip.dataset.svc; doSearch(true); });\n    });\n    document.querySelectorAll('.popular-card').forEach(card => {\n      card.addEventListener('click', () => { svcSel.value = card.dataset.svc; doSearch(true); });\n    });\n\n    function bookPro(name) {\n      alert('¡Genial! Estás a un paso de reservar a ' + name + '.\\n\\nEn la app real aquí elegirías fecha, hora y confirmarías tu reserva con pago seguro. 🛠️');\n    }\n\n    // Nav scroll\n    const nav = document.getElementById('mainNav');\n    window.addEventListener('scroll', () => nav.classList.toggle('scrolled', window.scrollY > 20));\n\n    document.querySelectorAll('a[href^=\"#\"]').forEach(link => {\n      link.addEventListener('click', e => {\n        const target = document.querySelector(link.getAttribute('href'));\n        if (target) {\n          e.preventDefault();\n          const top = target.getBoundingClientRect().top + window.scrollY - 80;\n          window.scrollTo({ top, behavior: 'smooth' });\n        }\n      });\n    });\n\n    // Contact form\n    const submitBtn = document.getElementById('formSubmit');\n    const formEl = document.getElementById('contactForm');\n    const successEl = document.getElementById('formSuccess');\n    if (submitBtn) {\n      submitBtn.addEventListener('click', () => {\n        const name = document.getElementById('fname').value.trim();\n        const phone = document.getElementById('fphone').value.trim();\n        const service = document.getElementById('fservice').value;\n        if (!name || !phone || !service) {\n          [document.getElementById('fname'), document.getElementById('fphone'), document.getElementById('fservice')].forEach(el => {\n            if (!el.value.trim()) {\n              el.style.borderColor = '#d94f6c';\n              el.style.boxShadow = '0 0 0 3px rgba(217,79,108,0.12)';\n              setTimeout(() => { el.style.borderColor = ''; el.style.boxShadow = ''; }, 2000);\n            }\n          });\n          return;\n        }\n        submitBtn.textContent = 'Enviando…';\n        submitBtn.disabled = true;\n        setTimeout(() => { formEl.style.display = 'none'; successEl.style.display = 'block'; }, 900);\n      });\n    }\n    function resetForm() {\n      ['fname','fphone','fservice','fdesc'].forEach(id => { document.getElementById(id).value = ''; });\n      submitBtn.textContent = 'Enviar solicitud →';\n      submitBtn.disabled = false;\n      formEl.style.display = 'block';\n      successEl.style.display = 'none';\n    }\n\n    // ── Pricing: cotizador + membership toggle ──\n    (function () {\n      const BASE = { plomeria: 1100, electricidad: 1450, cerrajeria: 850, albanileria: 1800, mantenimiento: 980, jardineria: 620 };\n      const URG = { normal: 1.0, dia: 1.3, emergencia: 1.8 };\n      const LOC = { residencial: 1.0, comercial: 1.15, premium: 1.35 };\n      const state = { svc: 'plomeria', urg: 'normal', loc: 'residencial' };\n\n      function update() {\n        const base = BASE[state.svc] || 1000;\n        const price = Math.round((base * URG[state.urg] * LOC[state.loc]) / 10) * 10;\n        const member = Math.round(price * 0.85);\n        const priceEl = document.getElementById('czPrice');\n        const memEl = document.getElementById('czMember');\n        if (priceEl) priceEl.innerHTML = '$' + price.toLocaleString('es-MX') + ' <small>MXN aprox.<\u002Fsmall>';\n        if (memEl) memEl.textContent = '$' + member.toLocaleString('es-MX');\n      }\n      document.querySelectorAll('.cz-chip[data-cz]').forEach(ch => {\n        ch.addEventListener('click', () => {\n          const g = ch.dataset.cz;\n          state[g] = ch.dataset.val;\n          document.querySelectorAll('.cz-chip[data-cz=\"' + g + '\"]').forEach(x => x.classList.toggle('active', x === ch));\n          update();\n        });\n      });\n      update();\n\n      const pill = document.getElementById('cyclePill');\n      if (pill) {\n        pill.addEventListener('click', () => {\n          const annual = pill.classList.toggle('annual');\n          document.getElementById('lblMonthly').classList.toggle('on', !annual);\n          document.getElementById('lblAnnual').classList.toggle('on', annual);\n          document.querySelectorAll('.plan-price').forEach(p => {\n            const span = p.querySelector('span');\n            if (span) span.textContent = annual ? p.dataset.a : p.dataset.m;\n            const small = p.querySelector('small');\n            if (small) small.textContent = annual ? ' /año' : ' /mes';\n          });\n          document.querySelectorAll('.plan-cycle').forEach(c => { c.textContent = annual ? c.dataset.a : c.dataset.m; });\n        });\n      }\n    })();\n\n    render();\n  <\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
