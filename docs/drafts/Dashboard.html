  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ter-spacing: .04em;\n    }\n\n    .msg.event .dot {\n      width: 6px;\n      height: 6px;\n      border-radius: 50%;\n      background: var(--c-work);\n      box-shadow: 0 0 6px var(--c-work)\n    }\n\n    /* ────── INFO COLUMN (right) ────── */\n    .info-col {\n      background: linear-gradient(180deg, var(--bg-2), var(--bg-1));\n      border: 1px solid var(--line);\n      border-radius: 14px;\n      display: flex;\n      flex-direction: column;\n      overflow: hidden\n    }\n\n    .info-col .head {\n      padding: 13px 16px;\n      border-bottom: 1px solid var(--line);\n      display: flex;\n      align-items: center;\n      gap: 8px\n    }\n\n    .info-col .head h2 {\n      font-family: Outfit, sans-serif;\n      font-weight: 800;\n      font-size: 17px;\n      letter-spacing: -.02em;\n      letter-spacing: -.01em\n    }\n\n    .info-col .head .sub {\n      font-family: Outfit, sans-serif;\n      font-size: 10px;\n      color: var(--ink-faint);\n      letter-spacing: .05em;\n      margin-left: auto\n    }\n\n    .info-col .body {\n      flex: 1;\n      overflow-y: auto;\n      padding: 14px;\n      display: flex;\n      flex-direction: column;\n      gap: 14px\n    }\n\n    /* MAP */\n    .map-wrap {\n      position: relative;\n      border-radius: 12px;\n      overflow: hidden;\n      background: #0f1320;\n      border: 1px solid var(--line);\n      aspect-ratio: 1 / 0.84;\n    }\n\n    .map-wrap svg {\n      display: block;\n      width: 100%;\n      height: 100%\n    }\n\n    .map-legend {\n      position: absolute;\n      left: 10px;\n      top: 10px;\n      display: flex;\n      flex-direction: column;\n      gap: 5px;\n      font-family: Outfit, sans-serif;\n      font-size: 9.5px;\n      color: var(--ink-dim);\n      letter-spacing: .04em;\n      background: rgba(6, 38, 40, 0.78);\n      backdrop-filter: blur(8px);\n      padding: 7px 10px;\n      border-radius: 8px;\n      border: 1px solid var(--line);\n    }\n\n    .map-legend .row {\n      display: olute;\n      bottom: -1px;\n      right: -1px;\n      width: 9px;\n      height: 9px;\n      border-radius: 50%;\n      border: 2px solid var(--bg-0)\n    }\n\n    .st.act {\n      background: #86efac;\n      box-shadow: 0 0 6px #86efac\n    }\n\n    .st.route {\n      background: #7dd3fc;\n      box-shadow: 0 0 6px #7dd3fc\n    }\n\n    .st.work {\n      background: #fbbf24;\n      box-shadow: 0 0 6px #fbbf24\n    }\n\n    .st.off {\n      background: #6b7080\n    }\n\n    .info-card .person .nm {\n      font-size: 13px;\n      font-weight: 500;\n      line-height: 1.2\n    }\n\n    .info-card .person .m {\n      font-size: 10.5px;\n      color: var(--ink-faint);\n      font-family: Outfit, sans-serif;\n      margin-top: 3px\n    }\n\n    .info-card .kv {\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n      padding: 5px 0;\n      border-top: 1px solid var(--line);\n      font-size: 11.5px\n    }\n\n    .info-card .kv:first-of-type {\n      border-top: 0\n    }\n\n    .info-card .kv .k {\n      color: var(--ink-faint);\n      font-family: Outfit, sans-serif;\n      font-size: 10px;\n      letter-spacing: .05em\n    }\n\n    .info-card .kv .v {\n      color: var(--ink);\n      font-weight: 500\n    }\n\n    .info-card.empty {\n      background: transparent;\n      border: 1px dashed var(--line);\n      text-align: center;\n      color: var(--ink-faint);\n      font-size: 12px;\n      padding: 18px\n    }\n\n    .info-actions {\n      display: flex;\n      gap: 6px;\n      flex-wrap: wrap;\n      margin-top: 4px\n    }\n\n    .info-actions button {\n      flex: 1;\n      min-width: 0;\n      font: 600 10.5px/1 Outfit, sans-serif;\n      letter-spacing: .04em;\n      padding: 9px 8px;\n      border-radius: 8px;\n      cursor: pointer;\n      background: rgba(255, 255, 255, 0.04);\n      border: 1px solid var(--line);\n      color: var(--ink-dim);\n      transition: all .15s ease;\n    }\n\n    .info-actions button:hover {\n 02FlinearGradient>\n      <\u002Fdefs>\n      <path d=\"${area}\" fill=\"url(#g-${color.replace('#', '')})\"/>\n      <path d=\"${path}\" fill=\"none\" stroke=\"${color}\" stroke-width=\"1.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\n    <\u002Fsvg>\n  `;\n    }\n    const KPIS = [\n      { cls: 'c-mint', ic: '$', lbl: 'Ingresos hoy', val: '$ 18,420', delta: '+12.4%', dir: 'up', spark: [8, 9, 7, 11, 10, 13, 15, 14, 17, 18], color: '#6ee7b7' },\n      { cls: 'c-blue', ic: '✸', lbl: 'Tickets activos', val: '47', sub: '/ 312 mes', delta: '+5', dir: 'up', spark: [28, 30, 29, 33, 35, 38, 42, 44, 46, 47], color: '#6ea8fe' },\n      { cls: 'c-cyan', ic: '⚒', lbl: 'Colaboradores en ruta', val: '2', sub: '/ 28 act.', delta: 'estable', dir: 'flat', spark: [2, 1, 2, 3, 2, 2, 3, 2, 2, 2], color: '#7dd3fc' },\n      { cls: 'c-amber', ic: '%', lbl: 'Conversión', val: '68', sub: '%', delta: '+3.1pp', dir: 'up', spark: [58, 62, 60, 64, 63, 66, 65, 67, 68, 68], color: '#fbbf24' },\n      { cls: 'c-pink', ic: '★', lbl: 'NPS · 30d', val: '72', sub: '/ 100', delta: '-1.4', dir: 'down', spark: [75, 74, 76, 73, 72, 73, 72, 71, 72, 72], color: '#f9a8d4' },\n    ];\n    function renderKPIs() {\n      document.getElementById('kpis').innerHTML = KPIS.map(k => `\n    <div class=\"kpi ${k.cls}\">\n      <div class=\"lbl\"><span class=\"ic\">${k.ic}<\u002Fspan> ${k.lbl}<\u002Fdiv>\n      <div class=\"v\">${k.val}${k.sub ? `<small>${k.sub}<\u002Fsmall>` : ''}<\u002Fdiv>\n      <div class=\"delta ${k.dir}\">${k.dir === 'up' ? '▲' : k.dir === 'down' ? '▼' : '■'} ${k.delta}<\u002Fdiv>\n      ${spark(k.spark, k.color)}\n    <\u002Fdiv>\n  `).join('');\n    }\n\n    /* ───────── PIPELINE ───────── */\n    function renderPipeline() {\n      const grouped = {};\n      PHASES.forEach(p => grouped[p.id] = []);\n      TICKETS.forEach(t => grouped[t.fase].push(t));\n      document.getElementById('pipeline').innerHTML = PHASES.map(p => {\n        const list = grouped[p.id];\n        return `\n      <div class=\"stage\" style=\"--c:${p.color}\">\n        <div class=\"stage-head\">\n          <span class=\"dot\"><\u002Fspan>\n          <span class=\"nm\">${p.id.toString().padStart(2, '0')} · ${p.short}<\u002Fspan>\n          <span class=\"ct\">${list.length}<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"stage-body\">\n          ${list.map(t => {\n          const s = SERVICES[t.svc];\n          return `\n              <div class=\"ticket\" data-id=\"${t.id}\">\n                <div class=\"row1\">\n                  <span class=\"id\">#${t.id.split('-')[1]}<\u002Fspan>\n                  <span class=\"urg ${t.urg}\">${t.urg.toUpperCase()}<\u002Fspan>\n                <\u002Fdiv>\n                <div class=\"nm\">${t.cliente}<\u002Fdiv>\n                <div class=\"row2\">\n                  <span class=\"svc\"><span class=\"em\">${s.em}<\u002Fspan>${s.label}<\u002Fspan>\n                  <span class=\"pr\">${t.monto ? '$' + t.monto.toLocaleString() : '—'}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>`;\n        }).join('') || '<div style=\"color:var(--ink-mute);font-size:11px;text-align:center;padding:14px 0;font-family:Outfit,sans-serif\">vacío<\u002Fdiv>'}\n        <\u002Fdiv>\n      <\u002Fdiv>\n    `;\n      }).join('');\n      // bind clicks\n      document.querySelectorAll('.ticket').forEach(el => el.addEventListener('click', () => openTicket(el.dataset.id)));\n    }\n\n    /* ───────── TICKETS TABLE ───────── */\n    function avatar(name) {\n      const ini = name.split(' ').map(s => s[0]).slice(0, 2).join('').toUpperCase();\n      // hash to color\n      let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360;\n      const a = `hsl(${h},70%,72%)`, b = `hsl(${(h + 45) % 360},70%,72%)`;\n      return `<div class=\"ax\" style=\"background:linear-gradient(135deg,${a},${b})\">${ini}<\u002Fdiv>`;\n    }\n    function bars(phase) {\n      return `<div class=\"bars\">${PHASES.map(p => `<span class=\"b ${p.id <= phase ? 'on' : ''}\"><\u002Fspan>`).join('')}<\u002Fdiv>`;\n    }\n    function renderTickets() {\n      const tbody = document.querySelector('#tickets-tbl tbody');\n      tbody.innerHTML = TICKETS.map(t => {\n        const s = SERVICES[t.svc];\n        const ph = PHASES.find(p => p.id === t.fase);\n        return `\n      <tr data-id=\"${t.id}\">\n        <td class=\"col-id\">#${t.id.split('-')[1]}<\u002Ftd>\n        <td>\n          <div class=\"cli\">\n            ${avatar(t.cliente)}\n            <div class=\"info\">\n              <span class=\"n\">${t.cliente}<\u002Fspan>\n              <span class=\"e\">${t.email}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Ftd>\n        <td>\n          <span class=\"pill-svc\" style=\"--sc:${s.color}\"><span class=\"em\">${s.em}<\u002Fspan>${s.label}<\u002Fspan>\n        <\u002Ftd>\n        <td>\n          <div class=\"progress ph-${t.fase}\">\n            ${bars(t.fase)}\n            <span class=\"lbl\">${ph.short}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Ftd>\n        <td>\n          <span class=\"urg ${t.urg}\" style=\"font-family:Outfit,sans-serif;font-size:10.5px;padding:3px 7px;border-radius:4px;letter-spacing:.04em\">\n            ${t.urg === 'emg' ? '🚨 Emergencia' : t.urg === 'day' ? '📅 Mismo día' : '⏱️ Normal'}\n          <\u002Fspan>\n        <\u002Ftd>\n        <td style=\"text-align:right\"><span class=\"price\">${t.monto ? '$' + t.monto.toLocaleString() : '—'}<\u002Fspan><\u002Ftd>\n      <\u002Ftr>\n    `;\n      }).join('');\n      tbody.querySelectorAll('tr').forEach(tr => tr.addEventListener('click', () => openTicket(tr.dataset.id)));\n    }\n\n    /* ───────── DONUT ───────── */\n    function renderDonut() {\n      const counts = {};\n      TICKETS.forEach(t => counts[t.svc] = (counts[t.svc] || 0) + 1);\n      // pad with realistic numbers\n      const data = [\n        { k: 'plomeria', v: 38 },\n        { k: 'electrica', v: 24 },\n        { k: 'hogar', v: 18 },\n        { k: 'albanil', v: 12 },\n        { k: 'jardineria', v: 5 },\n        { k: 'cerrajeria', v: 3 },\n      ];\n      const total = data.reduce((a, b) => a + b.v, 0);\n      const cx = 60, cy = 60, r = 42, sw = 14;\n      const C = 2 * Math.PI * r;\n      let offset = 0;\n      const svg = document.getElementById('donut');\n      svg.innerHTML = '';\n      // base ring\n      const base = document.createElementNS('http://www.w3.org/2000/svg', 'circle');\n      base.setAttribute('cx', cx); base.setAttribute('cy', cy); base.setAttribute('r', r);\n      base.setAttribute('fill', 'none'); base.setAttribute('stroke', 'rgba(255,255,255,0.05)'); base.setAttribute('stroke-width', sw);\n      svg.appendChild(base);\n      data.forEach(d => {\n        const len = (d.v / total) * C;\n        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');\n        c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', r);\n        c.setAttribute('fill', 'none');\n        c.setAttribute('stroke', SERVICES[d.k].color);\n        c.setAttribute('stroke-width', sw);\n        c.setAttribute('stroke-dasharray', `${len} ${C - len}`);\n        c.setAttribute('stroke-dashoffset', -offset);\n        c.setAttribute('transform', `rotate(-90 ${cx} ${cy})`);\n        c.setAttribute('stroke-linecap', 'butt');\n        svg.appendChild(c);\n        offset += len;\n      });\n      // total label\n      const tt = document.createElementNS('http://www.w3.org/2000/svg', 'text');\n      tt.setAttribute('x', cx); tt.setAttribute('y', cy - 2); tt.setAttribute('text-anchor', 'middle');\n      tt.setAttribute('fill', '#f4f5f8'); tt.setAttribute('font-family', 'Outfit, sans-serif');\n      tt.setAttribute('font-size', '22');\n      tt.textContent = total;\n      svg.appendChild(tt);\n      const tt2 = document.createElementNS('http://www.w3.org/2000/svg', 'text');\n      tt2.setAttribute('x', cx); tt2.setAttribute('y', cy + 14); tt2.setAttribute('text-anchor', 'middle');\n      tt2.setAttribute('fill', '#6b7080'); tt2.setAttribute('font-family', 'Outfit, sans-serif');\n      tt2.setAttribute('font-size', '9'); tt2.setAttribute('letter-spacing', '1.2');\n      tt2.textContent = 'TICKETS / 30D';\n      svg.appendChild(tt2);\n\n      // legend\n      document.getElementById('donut-legend').innerHTML = data.map(d => `\n    <div class=\"li\">\n      <span class=\"sw\" style=\"background:${SERVICES[d.k].color}\"><\u002Fspan>\n      <span class=\"nm\">${SERVICES[d.k].em} ${SERVICES[d.k].label}<\u002Fspan>\n      <span class=\"pct\">${Math.round(d.v / total * 100)}%<\u002Fspan>\n    <\u002Fdiv>\n  `).join('');\n    }\n\n    /* ───────── PROVIDERS ───────── */\n    function renderProviders() {\n      document.getElementById('prov-list').innerHTML = PROVIDERS.map(p => {\n        const s = SERVICES[p.svc];\n        return `\n      <div class=\"prov\" style=\"--from:${p.from};--to:${p.to}\">\n        <div class=\"ax\">${p.initials}<\u002Fdiv>\n        <div class=\"info\">\n          <div class=\"n\">${p.name}<\u002Fdiv>\n          <div class=\"m\">${s.em} ${s.label} · ${p.jobs} servicios<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"stars\">\n          <span>★ ${p.rating.toFixed(1)}<\u002Fspan>\n          <span class=\"ct\">RATING<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    `;\n      }).join('');\n    }\n\n    /* ───────── FUNNEL ───────── */\n    function renderFunnel() {\n      const max = FUNNEL[0].v;\n      document.getElementById('funnel').innerHTML = FUNNEL.map((f, i) => {\n        const w = Math.round((f.v / max) * 100);\n        const conv = i === 0 ? 100 : Math.round(f.v / FUNNEL[0].v * 100);\n        return `\n      <div class=\"fn-row\" style=\"--c:${f.c};--w:${w}%\">\n        <span class=\"l\">${f.l}<\u002Fspan>\n        <span class=\"v\">${f.v}<\u002Fspan>\n        <span class=\"pct\">${conv}%<\u002Fspan>\n      <\u002Fdiv>\n    `;\n      }).join('');\n    }\n\n    /* ───────── MODAL ───────── */\n    const overlay = document.getElementById('overlay');\n    const sheet = document.getElementById('sheet');\n    function openTicket(id) {\n      const t = TICKETS.find(x => x.id === id); if (!t) return;\n      const ph = PHASES.find(p => p.id === t.fase);\n      const s = SERVICES[t.svc];\n      const cat = ['action', 'route', 'info', 'quote', 'work', 'check', 'pay', 'done'][t.fase - 1];\n      const phaseColors = ['var(--c-start)', 'var(--c-route)', 'var(--c-info)', 'var(--c-quote)', 'var(--c-work)', 'var(--c-check)', 'var(--c-pay)', 'var(--c-done)'];\n      sheet.style.setProperty('--c', ph.color);\n      sheet.dataset.cat = cat;\n\n      sheet.querySelector('[data-r=\"tag\"]').textContent = ph.name + ' · fase ' + t.fase + '/8';\n      sheet.querySelector('[data-r=\"id\"]').textContent = '#' + t.id;\n      sheet.querySelector('[data-r=\"title\"]').textContent = t.cliente + ' · ' + s.em + ' ' + s.label;\n\n      const tlBuilt = [\n        { id: 1, h: 'Saludo enviado', d: '/hi · cliente recibió el menú de servicios', t: t.iniciado },\n        { id: 2, h: 'Servicio seleccionado', d: s.em + ' ' + s.label, t: '+1m' },\n        { id: 3, h: 'Discovery', d: '/ubicacion_tipo → ' + t.ubic + '  ·  /urgencia → ' + (t.urg === 'emg' ? '24/7' : t.urg === 'day' ? 'mismo día' : 'normal'), t: '+3m' },\n        { id: 4, h: 'Presupuesto enviado', d: t.monto ? '$' + t.monto.toLocaleString() + ' confirmado por cliente' : 'Pendiente', t: '+8m' },\n        { id: 5, h: 'Colaborador en ruta', d: provName(t) ? provName(t) + ' — ETA ' + t.eta : 'Por asignar', t: '+12m' },\n        { id: 6, h: 'Validación del cliente', d: 'Esperando confirmación del trabajo', t: 'pendiente' },\n        { id: 7, h: 'Pago procesado', d: '/pago · transferencia confirmada', t: 'pendiente' },\n        { id: 8, h: 'Factura digital enviada', d: '/factura_digital · PDF al correo del cliente', t: 'pendiente' },\n      ];\n\n      sheet.querySelector('[data-r=\"body\"]').innerHTML = `\n    <div class=\"sheet-grid\">\n      <div class=\"ms-card\">\n        <div class=\"lbl\">Cliente<\u002Fdiv>\n        <div class=\"v\">${t.cliente}<\u002Fdiv>\n        <div class=\"lbl\" style=\"margin-top:8px\">Correo<\u002Fdiv>\n        <div class=\"v\" style=\"font-family:Outfit,sans-serif;font-size:11.5px;color:var(--ink-dim)\">${t.email}<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"ms-card\">\n        <div class=\"lbl\">Servicio<\u002Fdiv>\n        <div class=\"v\">${s.em} ${s.label}<\u002Fdiv>\n        <div class=\"lbl\" style=\"margin-top:8px\">Ubicación<\u002Fdiv>\n        <div class=\"v\" style=\"font-size:12px;color:var(--ink-dim)\">${t.ubic}<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"ms-card\">\n        <div class=\"lbl\">Monto cotizado<\u002Fdiv>\n        <div class=\"v\" style=\"font-family:Outfit,sans-serif;font-weight:600;color:${ph.color}\">${t.monto ? '$' + t.monto.toLocaleString() + ' MXN' : 'Sin presupuesto'}<\u002Fdiv>\n        <div class=\"lbl\" style=\"margin-top:8px\">Urgencia<\u002Fdiv>\n        <div class=\"v\" style=\"font-size:12px;color:var(--ink-dim)\">${t.urg === 'emg' ? '🚨 Emergencia 24/7' : t.urg === 'day' ? '📅 Mismo día' : '⏱️ Normal'}<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"ms-card\">\n        <div class=\"lbl\">Colaborador<\u002Fdiv>\n        <div class=\"v\">${provName(t) || '—'}<\u002Fdiv>\n        <div class=\"lbl\" style=\"margin-top:8px\">Iniciado<\u002Fdiv>\n        <div class=\"v\" style=\"font-family:Outfit,sans-serif;font-size:11.5px;color:var(--ink-dim)\">${t.iniciado} · ${t.eta}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"ms-card\" style=\"margin-bottom:18px\">\n      <div class=\"lbl\">Progreso del flujo<\u002Fdiv>\n      <div class=\"ms-track\">\n        ${PHASES.map(p => `<span class=\"step ${p.id < t.fase ? 'on' : ''} ${p.id === t.fase ? 'cur' : ''}\" style=\"background-color:${p.id <= t.fase ? phaseColors[p.id - 1] : ''}\"><\u002Fspan>`).join('')}\n      <\u002Fdiv>\n      <div class=\"ms-track-lbl\">\n        <span>${PHASES[0].short.toUpperCase()}<\u002Fspan>\n        <span style=\"color:${ph.color}\">${ph.name.toUpperCase()} · ${t.fase}/8<\u002Fspan>\n        <span>${PHASES[7].short.toUpperCase()}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"lbl\" style=\"font-family:Outfit,sans-serif;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:10px\">Línea de tiempo<\u002Fdiv>\n    <div class=\"timeline\">\n      ${tlBuilt.map(s => {\n        const passed = s.id <= t.fase;\n        const cur = s.id === t.fase;\n        const tlc = passed ? phaseColors[s.id - 1] : 'var(--ink-mute)';\n        return `\n          <div class=\"tl-item\" style=\"--tlc:${tlc}\">\n            <div class=\"h\" style=\"${cur ? 'color:' + phaseColors[s.id - 1] : ''}\">${s.h} ${cur ? '<span style=\"margin-left:6px;font-family:Outfit,sans-serif;font-size:9.5px;letter-spacing:.1em;color:' + phaseColors[s.id - 1] + '\">● EN CURSO<\u002Fspan>' : ''}<span class=\"t\">${s.t}<\u002Fspan><\u002Fdiv>\n            <div class=\"d\">${s.d}<\u002Fdiv>\n          <\u002Fdiv>\n        `;\n      }).join('')}\n    <\u002Fdiv>\n  `;\n\n      overlay.classList.add('is-open');\n      document.body.style.overflow = 'hidden';\n    }\n    function closeSheet() {\n      overlay.classList.remove('is-open');\n      document.body.style.overflow = '';\n    }\n    overlay.addEventListener('click', e => { if (e.target === overlay) closeSheet(); });\n    document.getElementById('sheet-close').addEventListener('click', closeSheet);\n    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });\n\n    /* ───────── INTERACTIVITY ───────── */\n    let activeChatId = TICKETS[0].id;\n    let activeChatTab = 'cliente'; // 'cliente' | 'colab'\n\n    function provName(t) { return t?.collabId ? COLLABS[t.collabId]?.name : null; }\n    function provObj(t) { return t?.collabId ? COLLABS[t.collabId] : null; }\n\n    // build per-ticket fake chat history based on phase\n    function historyFor(t) {\n      const s = SERVICES[t.svc];\n      const baseT = t.iniciado;\n      const h = [];\n      if (t.fase >= 1) h.push({ who: 'bot', text: '¡Hola! 👋 Bienvenido/a a yessyfy. ¿Qué servicio necesitas hoy?', t: baseT });\n      if (t.fase >= 2) h.push({ who: 'cli', text: s.em + ' ' + s.label, t: '+1m' });\n      if (t.fase >= 2) h.push({ who: 'bot', text: 'Perfecto, ' + s.label.toLowerCase() + '. ¿Dónde está el problema y qué tan urgente es?', t: '+1m' });\n      if (t.fase >= 3) h.push({ who: 'cli', text: t.ubic, t: '+3m' });\n      if (t.fase >= 3) h.push({ who: 'cli', text: t.urg === 'emg' ? 'Es emergencia 🚨' : t.urg === 'day' ? 'Lo necesito hoy' : 'Cuando puedan', t: '+3m' });\n      if (t.fase >= 4 && t.monto) h.push({ who: 'bot', text: 'Listo. Tu presupuesto es de $' + t.monto.toLocaleString() + ' MXN. ¿Confirmas?', t: '+5m' });\n      if (t.fase >= 5 && t.monto) h.push({ who: 'cli', text: 'Sí, adelante 👍', t: '+6m' });\n      if (t.fase >= 5) h.push({ who: 'sys', text: 'Colaborador asignado: ' + (provName(t) || 'pendiente') });\n      if (t.fase >= 5) h.push({ who: 'bot', text: '¡En camino! 🚗 ETA ' + t.eta + '. Te aviso cuando llegue.', t: '+12m' });\n      if (t.fase >= 6) h.push({ who: 'bot', text: 'Trabajo finalizado ✓. ¿Quedó todo bien?', t: '+50m' });\n      if (t.fase >= 7) h.push({ who: 'cli', text: 'Sí, gracias!', t: '+52m' });\n      if (t.fase >= 7) h.push({ who: 'bot', text: 'Aquí están los datos para transferir: BBVA · 0123 4567 · $' + (t.monto || 0).toLocaleString(), t: '+52m' });\n      if (t.fase >= 8) h.push({ who: 'sys', text: 'Pago confirmado · factura enviada al correo' });\n      return h;\n    }\n\n    function renderChatList(filter = '') {\n      const f = filter.toLowerCase();\n      const visible = TICKETS.filter(t => !f || t.cliente.toLowerCase().includes(f) || t.id.includes(f));\n      document.getElementById('conv-count').textContent = visible.length;\n      document.getElementById('chat-list').innerHTML = visible.map(t => {\n        const ph = PHASES.find(p => p.id === t.fase);\n        const last = historyFor(t).slice(-1)[0];\n        const lastTxt = last ? (last.who === 'sys' ? '— ' + last.text : last.text) : '—';\n        let h = 0; for (const c of t.cliente) h = (h * 31 + c.charCodeAt(0)) % 360;\n        return `<div class=\"chat-row ${t.id === activeChatId ? 'is-on' : ''}\" data-id=\"${t.id}\" style=\"--c:${ph.color}\">\n      <div class=\"ax\" style=\"background:linear-gradient(135deg,hsl(${h},70%,72%),hsl(${(h + 45) % 360},70%,72%))\">${t.cliente.split(' ').map(s => s[0]).slice(0, 2).join('')}<\u002Fdiv>\n      <div class=\"info\">\n        <div class=\"top\"><span class=\"nm\">${t.cliente}<\u002Fspan><span class=\"t\">${t.iniciado}<\u002Fspan><\u002Fdiv>\n        <div class=\"sub\">${lastTxt}<\u002Fdiv>\n        <div class=\"meta\"><span class=\"ph-tag\">${String(t.fase).padStart(2, '0')} · ${ph.short}<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n      }).join('') || '<div class=\"empty-state\">Sin resultados<\u002Fdiv>';\n      document.querySelectorAll('.chat-row').forEach(r => r.addEventListener('click', () => { activeChatId = r.dataset.id; renderChatList(filter); renderChatPane(); setWsTab('chat'); }));\n    }\n\n    /* top-level workspace tabs: Conversación ⇄ Mapa & detalles */\n    let wsTab = 'chat';\n    function setWsTab(tab) {\n      wsTab = tab;\n      document.querySelectorAll('.ws-tab').forEach(b => b.classList.toggle('is-on', b.dataset.wtab === tab));\n      document.querySelectorAll('.ws-panes > [data-wpane]').forEach(p => p.classList.toggle('is-on', p.dataset.wpane === tab));\n    }\n\n    function renderChatPane() {\n      const t = TICKETS.find(x => x.id === activeChatId); if (!t) return;\n      const s = SERVICES[t.svc]; const ph = PHASES.find(p => p.id === t.fase);\n      let h = 0; for (const c of t.cliente) h = (h * 31 + c.charCodeAt(0)) % 360;\n\n      const hasCol = !!t.collabId;\n      const col = provObj(t);\n      const colHist = COLAB_CHATS[t.id] || [];\n      const cliHist = historyFor(t);\n\n      // header\n      const headHtml = `\n    <div class=\"chat-head\">\n      <div class=\"ax\" style=\"background:linear-gradient(135deg,hsl(${h},70%,72%),hsl(${(h + 45) % 360},70%,72%))\">${t.cliente.split(' ').map(s => s[0]).slice(0, 2).join('')}<\u002Fdiv>\n      <div class=\"who\">\n        <div class=\"nm\">${t.cliente} <span class=\"phase-mini\" style=\"--c:${ph.color}\">${String(t.fase).padStart(2, '0')} · ${ph.short}<\u002Fspan><\u002Fdiv>\n        <div class=\"sb\">#${t.id} · ${s.em} ${s.label}${col ? ` · trabaja <b style=\"color:var(--c-work)\">${col.name}<\u002Fb>` : ''}<\u002Fdiv>\n      <\u002Fdiv>\n      <button class=\"more-btn\" id=\"chat-detail\">Ver detalle<\u002Fbutton>\n      <button class=\"more-btn\" id=\"chat-advance\" style=\"color:${ph.color};border-color:color-mix(in oklab,${ph.color} 35%, var(--line))\">Avanzar fase ▶<\u002Fbutton>\n    <\u002Fdiv>\n  `;\n\n      // tabs\n      const tabsHtml = `\n    <div class=\"chat-tabs\">\n      <button data-tab=\"cliente\" class=\"${activeChatTab === 'cliente' ? 'is-on' : ''}\">\n        <span class=\"ax\" style=\"background:linear-gradient(135deg,hsl(${h},70%,72%),hsl(${(h + 45) % 360},70%,72%))\"><\u002Fspan>\n        Cliente <span class=\"count\">${cliHist.filter(m => m.who !== 'sys').length}<\u002Fspan>\n      <\u002Fbutton>\n      <button data-tab=\"colab\" class=\"${activeChatTab === 'colab' ? 'is-on' : ''}\" ${!hasCol ? 'disabled style=\"opacity:.4;cursor:not-allowed\"' : ''}>\n        ${col ? `<span class=\"ax\" style=\"background:linear-gradient(135deg,${col.av1},${col.av2})\"><\u002Fspan> ${col.name.split(' ')[0]}` : '<span class=\"ax\" style=\"background:#454a59\"><\u002Fspan> Sin colab'}\n        <span class=\"count\">${colHist.filter(m => m.who !== 'event').length || 0}<\u002Fspan>\n      <\u002Fbutton>\n      <span class=\"spacer\"><\u002Fspan>\n      <span class=\"phase-pill\" style=\"--c:${ph.color}\">${ph.name}<\u002Fspan>\n    <\u002Fdiv>\n  `;\n\n      // stream\n      let streamHtml;\n      if (activeChatTab === 'cliente') {\n        streamHtml = cliHist.map(m => m.who === 'sys'\n          ? `<div class=\"msg sys\">${m.text}<\u002Fdiv>`\n          : `<div class=\"msg ${m.who}\">${m.text}<span class=\"when\">${m.t || ''}<\u002Fspan><\u002Fdiv>`).join('');\n      } else {\n        streamHtml = !hasCol\n          ? `<div style=\"margin:auto;color:var(--ink-faint);font-size:12.5px;text-align:center;padding:40px 20px\">No hay colaborador asignado todavía.<br/><span style=\"font-size:11px\">Asigna uno desde la columna derecha →<\u002Fspan><\u002Fdiv>`\n          : colHist.map(m => {\n            if (m.who === 'event') return `<div class=\"msg event\"><span class=\"dot\"><\u002Fspan>${m.text}<\u002Fdiv>`;\n            return `<div class=\"msg ${m.who}\">${m.text}<span class=\"when\">${m.t || ''}<\u002Fspan><\u002Fdiv>`;\n          }).join('');\n      }\n\n      // quick replies — context-dependent\n      const cliQuick = `\n    <button data-q=\"hi\">/hi<\u002Fbutton>\n    <button data-q=\"ubicacion_tipo\">/ubicacion_tipo<\u002Fbutton>\n    <button data-q=\"urgencia\">/urgencia<\u002Fbutton>\n    <button data-q=\"confirmacion_ok\">/confirmacion_ok<\u002Fbutton>\n    <button data-q=\"en_camino\">/en_camino<\u002Fbutton>\n    <button data-q=\"finalizado\">/finalizado<\u002Fbutton>\n    <button data-q=\"pago\">/pago<\u002Fbutton>\n    <button data-q=\"factura_digital\">/factura_digital<\u002Fbutton>\n  `;\n      const colQuick = `\n    <button data-q=\"¿Cómo vas con el cliente?\">Estado del trabajo<\u002Fbutton>\n    <button data-q=\"¿Necesitas refuerzos?\">¿Refuerzos?<\u002Fbutton>\n    <button data-q=\"Confirma cuando llegues 📍\">Confirma llegada<\u002Fbutton>\n    <button data-q=\"Cliente reporta problema, revisa por favor\">⚠ Cliente reporta<\u002Fbutton>\n    <button data-q=\"Buen trabajo 🙌\">Felicitar<\u002Fbutton>\n  `;\n      const inputHtml = `\n    <div class=\"chat-input\">\n      <div class=\"quick\">${activeChatTab === 'cliente' ? cliQuick : colQuick}<\u002Fdiv>\n      <input id=\"chat-msg\" placeholder=\"${activeChatTab === 'cliente' ? 'Escribe un mensaje al cliente…' : 'Escribe un mensaje al colaborador…'}\"/>\n      <button class=\"send\" id=\"chat-send\">Enviar ⏎<\u002Fbutton>\n    <\u002Fdiv>\n  `;\n\n      document.getElementById('chat-pane').innerHTML = headHtml + tabsHtml + `<div class=\"chat-stream\" id=\"chat-stream\">${streamHtml}<\u002Fdiv>` + inputHtml;\n\n      const stream = document.getElementById('chat-stream');\n      stream.scrollTop = stream.scrollHeight;\n\n      document.getElementById('chat-detail').onclick = () => openTicket(t.id);\n      document.getElementById('chat-advance').onclick = () => advancePhase(t.id);\n      document.getElementById('chat-send').onclick = sendMsg;\n      document.getElementById('chat-msg').addEventListener('keydown', e => { if (e.key === 'Enter') sendMsg(); });\n      document.querySelectorAll('.chat-input .quick button').forEach(b => b.onclick = () => {\n        const v = b.dataset.q;\n        document.getElementById('chat-msg').value = activeChatTab === 'cliente' ? '/' + v : v;\n        document.getElementById('chat-msg').focus();\n      });\n      document.querySelectorAll('.chat-tabs button[data-tab]').forEach(b => b.addEventListener('click', () => {\n        if (b.hasAttribute('disabled')) return;\n        activeChatTab = b.dataset.tab;\n        renderChatPane();\n      }));\n\n      renderInfoCol(t);\n    }\n    function sendMsg() {\n      const inp = document.getElementById('chat-msg');\n      const v = inp.value.trim(); if (!v) return;\n      const stream = document.getElementById('chat-stream');\n      const t = TICKETS.find(x => x.id === activeChatId);\n      const node = document.createElement('div');\n      if (activeChatTab === 'cliente') {\n        node.className = 'msg bot';\n        node.innerHTML = v + '<span class=\"when\">ahora<\u002Fspan>';\n      } else {\n        node.className = 'msg adm';\n        node.innerHTML = v + '<span class=\"when\">ahora<\u002Fspan>';\n        COLAB_CHATS[t.id] = COLAB_CHATS[t.id] || [];\n        COLAB_CHATS[t.id].push({ who: 'adm', t: 'ahora', text: v });\n        // fake reply\n        setTimeout(() => {\n          const replies = ['Recibido 👍', 'Anotado', 'Confirmado', 'Voy en eso', 'Ok jefa'];\n          COLAB_CHATS[t.id].push({ who: 'col', t: 'ahora', text: replies[Math.floor(Math.random() * replies.length)] });\n          if (activeChatTab === 'colab') renderChatPane();\n        }, 1100 + Math.random() * 700);\n      }\n      stream.appendChild(node);\n      stream.scrollTop = stream.scrollHeight;\n      inp.value = ''; inp.focus();\n      toast(activeChatTab === 'cliente' ? 'Mensaje enviado al cliente' : 'Mensaje enviado al colaborador');\n    }\n\n    /* ─── MAP ─── */\n    function statusLabel(s) { return s === 'act' ? 'Disponible' : s === 'route' ? 'En camino' : s === 'work' ? 'Trabajando' : s === 'off' ? 'Offline' : '—' }\n\n    function renderMap(t) {\n      const c = provObj(t);\n      const cl = t.clientLoc;\n      const cv = t.collabLoc;\n      const showRoute = c && cv && cl && t.collabState && t.collabState !== 'finalizado';\n\n      // Stylized SVG map: streets, blocks, river, parks, pins\n      return `\n    <div class=\"map-wrap\">\n      <svg viewBox=\"0 0 800 670\" preserveAspectRatio=\"xMidYMid slice\" aria-hidden=\"true\">\n        <defs>\n          <linearGradient id=\"mp-bg\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\">\n            <stop offset=\"0%\" stop-color=\"#10141f\"/>\n            <stop offset=\"100%\" stop-color=\"#0a0c14\"/>\n          <\u002FlinearGradient>\n          <pattern id=\"mp-grid\" width=\"40\" height=\"40\" patternUnits=\"userSpaceOnUse\">\n            <path d=\"M40 0 L0 0 0 40\" fill=\"none\" stroke=\"rgba(255,255,255,0.025)\" stroke-width=\"0.5\"/>\n          <\u002Fpattern>\n          <radialGradient id=\"mp-park\" cx=\"50%\" cy=\"50%\" r=\"50%\">\n            <stop offset=\"0%\" stop-color=\"#1a3f2c\"/>\n            <stop offset=\"100%\" stop-color=\"#11201a\"/>\n          <\u002FradialGradient>\n          <radialGradient id=\"mp-glow-cli\" cx=\"50%\" cy=\"50%\" r=\"50%\">\n            <stop offset=\"0%\" stop-color=\"#f9a8d4\" stop-opacity=\"0.55\"/>\n            <stop offset=\"100%\" stop-color=\"#f9a8d4\" stop-opacity=\"0\"/>\n          <\u002FradialGradient>\n          <radialGradient id=\"mp-glow-col\" cx=\"50%\" cy=\"50%\" r=\"50%\">\n            <stop offset=\"0%\" stop-color=\"#7dd3fc\" stop-opacity=\"0.55\"/>\n            <stop offset=\"100%\" stop-color=\"#7dd3fc\" stop-opacity=\"0\"/>\n          <\u002FradialGradient>\n        <\u002Fdefs>\n        <!-- bg -->\n        <rect width=\"800\" height=\"670\" fill=\"url(#mp-bg)\"/>\n        <rect width=\"800\" height=\"670\" fill=\"url(#mp-grid)\"/>\n\n        <!-- blocks -->\n        <g fill=\"#161b29\" stroke=\"rgba(255,255,255,0.04)\" stroke-width=\"0.6\">\n          <rect x=\"40\"  y=\"40\"  width=\"180\" height=\"120\" rx=\"4\"/>\n          <rect x=\"240\" y=\"40\"  width=\"140\" height=\"120\" rx=\"4\"/>\n          <rect x=\"400\" y=\"40\"  width=\"200\" height=\"80\"  rx=\"4\"/>\n          <rect x=\"620\" y=\"40\"  width=\"140\" height=\"160\" rx=\"4\"/>\n          <rect x=\"40\"  y=\"180\" width=\"180\" height=\"100\" rx=\"4\"/>\n          <rect x=\"240\" y=\"180\" width=\"140\" height=\"100\" rx=\"4\"/>\n          <rect x=\"400\" y=\"140\" width=\"200\" height=\"140\" rx=\"4\"/>\n          <rect x=\"40\"  y=\"300\" width=\"120\" height=\"160\" rx=\"4\"/>\n          <rect x=\"180\" y=\"300\" width=\"100\" height=\"100\" rx=\"4\"/>\n          <rect x=\"300\" y=\"300\" width=\"100\" height=\"160\" rx=\"4\"/>\n          <rect x=\"420\" y=\"300\" width=\"180\" height=\"100\" rx=\"4\"/>\n          <rect x=\"620\" y=\"220\" width=\"140\" height=\"180\" rx=\"4\"/>\n          <rect x=\"40\"  y=\"480\" width=\"220\" height=\"150\" rx=\"4\"/>\n          <rect x=\"280\" y=\"420\" width=\"120\" height=\"210\" rx=\"4\"/>\n          <rect x=\"420\" y=\"420\" width=\"160\" height=\"100\" rx=\"4\"/>\n          <rect x=\"600\" y=\"420\" width=\"160\" height=\"210\" rx=\"4\"/>\n          <rect x=\"420\" y=\"540\" width=\"160\" height=\"90\"  rx=\"4\"/>\n        <\u002Fg>\n\n        <!-- park -->\n        <ellipse cx=\"200\" cy=\"380\" rx=\"60\" ry=\"45\" fill=\"url(#mp-park)\" opacity=\"0.85\"/>\n        <text x=\"200\" y=\"385\" text-anchor=\"middle\" font-family=\"Outfit, sans-serif\" font-weight=\"500\" font-size=\"9\" fill=\"#3d6e54\" letter-spacing=\"1\">PARQUE<\u002Ftext>\n\n        <!-- major streets -->\n        <g stroke=\"#1f2538\" stroke-width=\"14\" stroke-linecap=\"round\">\n          <line x1=\"0\"   y1=\"170\"  x2=\"800\" y2=\"170\"/>\n          <line x1=\"0\"   y1=\"290\"  x2=\"800\" y2=\"290\"/>\n          <line x1=\"0\"   y1=\"410\"  x2=\"800\" y2=\"410\"/>\n          <line x1=\"230\" y1=\"0\"    x2=\"230\" y2=\"670\"/>\n          <line x1=\"610\" y1=\"0\"    x2=\"610\" y2=\"670\"/>\n        <\u002Fg>\n        <g stroke=\"#2a3148\" stroke-width=\"1\" stroke-dasharray=\"10 8\">\n          <line x1=\"0\"   y1=\"170\"  x2=\"800\" y2=\"170\"/>\n          <line x1=\"0\"   y1=\"290\"  x2=\"800\" y2=\"290\"/>\n          <line x1=\"0\"   y1=\"410\"  x2=\"800\" y2=\"410\"/>\n          <line x1=\"230\" y1=\"0\"    x2=\"230\" y2=\"670\"/>\n          <line x1=\"610\" y1=\"0\"    x2=\"610\" y2=\"670\"/>\n        <\u002Fg>\n\n        ${showRoute ? `\n          <!-- route -->\n          <path id=\"route-path-${t.id}\" d=\"M ${cv.x} ${cv.y} Q ${(cv.x + cl.x) / 2 - 30} ${(cv.y + cl.y) / 2 - 40}, ${cl.x} ${cl.y}\"\n                stroke=\"#7dd3fc\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-dasharray=\"8 6\" fill=\"none\" opacity=\"0.85\">\n            <animate attributeName=\"stroke-dashoffset\" from=\"0\" to=\"-28\" dur=\"1.4s\" repeatCount=\"indefinite\"/>\n          <\u002Fpath>\n        ` : ''}\n\n        ${cl ? `\n          <!-- client pin -->\n          <circle cx=\"${cl.x}\" cy=\"${cl.y}\" r=\"40\" fill=\"url(#mp-glow-cli)\"/>\n          <g transform=\"translate(${cl.x}, ${cl.y})\">\n            <circle r=\"9\" fill=\"#f9a8d4\" stroke=\"#fff\" stroke-width=\"2\"/>\n            <circle r=\"3\" fill=\"#0a0c14\"/>\n            <text y=\"-16\" text-anchor=\"middle\" font-family=\"Outfit, sans-serif\" font-weight=\"500\" font-size=\"10\" fill=\"#f9a8d4\" font-weight=\"600\">CLIENTE<\u002Ftext>\n          <\u002Fg>\n        ` : ''}\n\n        ${cv ? `\n          <!-- collab pin -->\n          ${showRoute && t.collabState === 'en_camino' ? `\n            <g>\n              <circle r=\"40\" fill=\"url(#mp-glow-col)\">\n                <animateMotion dur=\"14s\" repeatCount=\"indefinite\" rotate=\"0\">\n                  <mpath href=\"#route-path-${t.id}\"/>\n                <\u002FanimateMotion>\n                <animate attributeName=\"r\" values=\"32;48;32\" dur=\"2s\" repeatCount=\"indefinite\"/>\n              <\u002Fcircle>\n              <g>\n                <circle r=\"13\" fill=\"#7dd3fc\" stroke=\"#0a0c14\" stroke-width=\"2\"/>\n                <text y=\"4\" text-anchor=\"middle\" font-family=\"Outfit, sans-serif\" font-size=\"11\" font-weight=\"700\" fill=\"#0a0c14\">${c?.initials || '?'}<\u002Ftext>\n                <text y=\"-22\" text-anchor=\"middle\" font-family=\"Outfit, sans-serif\" font-weight=\"500\" font-size=\"10\" fill=\"#7dd3fc\" font-weight=\"600\">${(c?.name || 'COLAB').toUpperCase().split(' ')[0]}<\u002Ftext>\n                <animateMotion dur=\"14s\" repeatCount=\"indefinite\" rotate=\"0\">\n                  <mpath href=\"#route-path-${t.id}\"/>\n                <\u002FanimateMotion>\n              <\u002Fg>\n            <\u002Fg>\n          ` : `\n            <circle cx=\"${cv.x}\" cy=\"${cv.y}\" r=\"40\" fill=\"url(#mp-glow-col)\"/>\n            <g transform=\"translate(${cv.x}, ${cv.y})\">\n              <circle r=\"13\" fill=\"#7dd3fc\" stroke=\"#0a0c14\" stroke-width=\"2\"/>\n              <text y=\"4\" text-anchor=\"middle\" font-family=\"Outfit, sans-serif\" font-size=\"11\" font-weight=\"700\" fill=\"#0a0c14\">${c?.initials || '?'}<\u002Ftext>\n              <text y=\"-22\" text-anchor=\"middle\" font-family=\"Outfit, sans-serif\" font-weight=\"500\" font-size=\"10\" fill=\"#7dd3fc\" font-weight=\"600\">${(c?.name || 'COLAB').toUpperCase().split(' ')[0]}<\u002Ftext>\n            <\u002Fg>\n          `}\n        ` : ''}\n      <\u002Fsvg>\n\n      <div class=\"map-legend\">\n        <div class=\"row\"><span class=\"pin\" style=\"background:#f9a8d4\"><\u002Fspan> Cliente<\u002Fdiv>\n        <div class=\"row\"><span class=\"pin\" style=\"background:#7dd3fc\"><\u002Fspan> Colaborador<\u002Fdiv>\n      <\u002Fdiv>\n      ${cv && cl && showRoute ? `\n        <div class=\"map-eta\">\n          <span class=\"v\">${t.eta}<\u002Fspan>\n          <span class=\"l\">ETA · ${Math.round(Math.hypot(cv.x - cl.x, cv.y - cl.y) / 40 * 10) / 10} km<\u002Fspan>\n        <\u002Fdiv>\n      ` : t.collabState === 'finalizado' ? `\n        <div class=\"map-eta\" style=\"border-color:color-mix(in oklab,var(--c-done) 40%,var(--line))\">\n          <span class=\"v\" style=\"color:var(--c-done)\">✓<\u002Fspan>\n          <span class=\"l\">Trabajo finalizado<\u002Fspan>\n        <\u002Fdiv>\n      ` : ''}\n    <\u002Fdiv>\n  `;\n    }\n\n    /* ─── INFO COLUMN ─── */\n    function renderInfoCol(t) {\n      if (!t) { document.getElementById('info-col').innerHTML = ''; return; }\n      const s = SERVICES[t.svc]; const ph = PHASES.find(p => p.id === t.fase);\n      const col = provObj(t);\n      let h = 0; for (const c of t.cliente) h = (h * 31 + c.charCodeAt(0)) % 360;\n\n      const colState = t.collabState ? t.collabState : null;\n      const collabStatusBadge = colState === 'en_camino' ? 'route' : colState === 'en_proceso' || colState === 'por_terminar' ? 'work' : colState === 'finalizado' ? 'act' : 'off';\n\n      document.getElementById('info-col').innerHTML = `\n    <div class=\"head\">\n      <h2>Mapa & detalles<\u002Fh2>\n      <span class=\"sub\">// #${t.id.split('-')[1]}<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"body\">\n      ${renderMap(t)}\n\n      <div class=\"info-card\" style=\"--c:${s.color}\">\n        <div class=\"lbl\"><span class=\"dot\"><\u002Fspan>Cliente<\u002Fdiv>\n        <div class=\"person\">\n          <div class=\"ax\" style=\"background:linear-gradient(135deg,hsl(${h},70%,72%),hsl(${(h + 45) % 360},70%,72%))\">${t.cliente.split(' ').map(s => s[0]).slice(0, 2).join('')}<\u002Fdiv>\n          <div><div class=\"nm\">${t.cliente}<\u002Fdiv><div class=\"m\">${t.email}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"kv\"><span class=\"k\">Servicio<\u002Fspan><span class=\"v\">${s.em} ${s.label}<\u002Fspan><\u002Fdiv>\n        <div class=\"kv\"><span class=\"k\">Ubicación<\u002Fspan><span class=\"v\">${t.ubic}<\u002Fspan><\u002Fdiv>\n        <div class=\"kv\"><span class=\"k\">Urgencia<\u002Fspan><span class=\"v\">${t.urg === 'emg' ? '🚨 Emergencia' : t.urg === 'day' ? '📅 Mismo día' : '⏱️ Normal'}<\u002Fspan><\u002Fdiv>\n        <div class=\"kv\"><span class=\"k\">Monto<\u002Fspan><span class=\"v\" style=\"color:${ph.color}\">${t.monto ? '$' + t.monto.toLocaleString() + ' MXN' : 'Sin cotizar'}<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      ${col ? `\n        <div class=\"info-card\" style=\"--c:var(--c-work)\">\n          <div class=\"lbl\"><span class=\"dot\"><\u002Fspan>Colaborador<\u002Fdiv>\n          <div class=\"person\">\n            <div class=\"ax\" style=\"background:linear-gradient(135deg,${col.av1},${col.av2})\">${col.initials}<span class=\"st ${collabStatusBadge}\"><\u002Fspan><\u002Fdiv>\n            <div><div class=\"nm\">${col.name}<\u002Fdiv><div class=\"m\">${col.vehicle}<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"kv\"><span class=\"k\">Estado<\u002Fspan><span class=\"v\" style=\"color:var(--c-work)\">${colState ? '/' + colState : 'sin estado'}<\u002Fspan><\u002Fdiv>\n          <div class=\"kv\"><span class=\"k\">Teléfono<\u002Fspan><span class=\"v\" style=\"font-family:Outfit,sans-serif;font-size:11px\">${col.phone}<\u002Fspan><\u002Fdiv>\n          <div class=\"kv\"><span class=\"k\">Rating<\u002Fspan><span class=\"v\" style=\"color:var(--c-check)\">★ ${col.rating.toFixed(1)}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      ` : `\n        <div class=\"info-card empty\">Sin colaborador asignado todavía.<\u002Fdiv>\n      `}\n\n      <div class=\"info-actions\">\n        <button id=\"info-advance\" class=\"advance\" ${t.fase >= 8 ? 'disabled style=\"opacity:.4;cursor:not-allowed\"' : ''}>Avanzar fase ▶<\u002Fbutton>\n        <button id=\"info-detail\">Ver detalle<\u002Fbutton>\n        ${col ? '<button id=\"info-reassign\">↻ Reasignar<\u002Fbutton>' : '<button id=\"info-assign\">＋ Asignar colab<\u002Fbutton>'}\n      <\u002Fdiv>\n    <\u002Fdiv>\n  `;\n\n      const adv = document.getElementById('info-advance'); if (adv && t.fase < 8) adv.onclick = () => advancePhase(t.id);\n      document.getElementById('info-detail').onclick = () => openTicket(t.id);\n      const r1 = document.getElementById('info-reassign'); if (r1) r1.onclick = () => openReassign(t);\n      const r2 = document.getElementById('info-assign'); if (r2) r2.onclick = () => openReassign(t);\n    }\n\n    /* ─── REASIGNAR COLABORADOR ─── */\n    function openReassign(t) {\n      if (!t) return;\n      const cur = t.collabId;\n      const statusRank = { act: 0, route: 1, work: 2, off: 3 };\n      const cands = Object.values(COLLABS).slice().sort((a, b) => {\n        const sameA = a.svc === t.svc ? 0 : 1, sameB = b.svc === t.svc ? 0 : 1;\n        if (sameA !== sameB) return sameA - sameB;\n        return (statusRank[a.status] ?? 9) - (statusRank[b.status] ?? 9);\n      });\n      const s = SERVICES[t.svc];\n      const stLbl = st => st === 'act' ? 'Disponible' : st === 'route' ? 'En camino' : st === 'work' ? 'Trabajando' : 'Offline';\n      const stCol = st => st === 'act' ? 'var(--c-done)' : st === 'route' ? 'var(--c-work)' : st === 'work' ? 'var(--c-check)' : 'var(--ink-faint)';\n\n      let ov = document.getElementById('reassign-overlay');\n      if (!ov) {\n        ov = document.createElement('div'); ov.className = 'sheet-overlay'; ov.id = 'reassign-overlay';\n        document.body.appendChild(ov);\n        ov.addEventListener('click', e => { if (e.target === ov) closeReassign(); });\n      }\n      ov.innerHTML = `<div class=\"sheet\" data-cat=\"route\" style=\"--c:var(--c-work)\">\n        <div class=\"sheet-head\">\n          <div class=\"left\">\n            <span class=\"sheet-tag\">Reasignar colaborador<\u002Fspan>\n            <span class=\"sheet-id\">#${t.id}<\u002Fspan>\n            <div class=\"sheet-title\">${s.em} ${s.label} · ${t.cliente}<\u002Fdiv>\n          <\u002Fdiv>\n          <button class=\"sheet-close\" id=\"reassign-close\">✕<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"sheet-body\">\n          <div style=\"font-family:Outfit,sans-serif;font-size:11px;color:var(--ink-dim);margin-bottom:12px\">${cur ? 'Asignado a <b style=\"color:var(--c-work)\">' + (provObj(t)?.name || '—') + '<\u002Fb>. ' : ''}Elige a quién reasignar este ticket — los colaboradores compatibles aparecen primero.<\u002Fdiv>\n          <div class=\"reassign-list\">\n            ${cands.map(c => {\n        const isCur = c.id === cur;\n        const same = c.svc === t.svc;\n        return `<button class=\"reassign-row${isCur ? ' is-current' : ''}\" data-cid=\"${c.id}\" ${isCur ? 'disabled' : ''}>\n                <div class=\"ax\" style=\"background:linear-gradient(135deg,${c.av1},${c.av2})\">${c.initials}<\u002Fdiv>\n                <div class=\"meta\">\n                  <div class=\"nm\">${c.name} ${same ? '<span class=\"match\">● compatible<\u002Fspan>' : ''}<\u002Fdiv>\n                  <div class=\"sub\">${SERVICES[c.svc].em} ${SERVICES[c.svc].label} · ${c.zone} · ★ ${c.rating} · ${c.jobsMonth} trabajos/mes<\u002Fdiv>\n                <\u002Fdiv>\n                <div class=\"st\"><span class=\"dot\" style=\"background:${stCol(c.status)}\"><\u002Fspan>${stLbl(c.status)}<\u002Fdiv>\n                <span class=\"pick\">${isCur ? 'Actual' : 'Asignar →'}<\u002Fspan>\n              <\u002Fbutton>`;\n      }).join('')}\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"sheet-foot\"><button id=\"reassign-cancel\">Cancelar<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>`;\n      document.getElementById('reassign-close').onclick = closeReassign;\n      document.getElementById('reassign-cancel').onclick = closeReassign;\n      ov.querySelectorAll('.reassign-row[data-cid]').forEach(r => r.onclick = () => {\n        if (r.hasAttribute('disabled')) return;\n        doReassign(t, r.dataset.cid);\n      });\n      requestAnimationFrame(() => ov.classList.add('is-open'));\n      document.body.style.overflow = 'hidden';\n    }\n    function closeReassign() {\n      const ov = document.getElementById('reassign-overlay');\n      if (ov) ov.classList.remove('is-open');\n      document.body.style.overflow = '';\n    }\n    function doReassign(t, cid) {\n      const c = COLLABS[cid]; if (!c) return;\n      const prev = provObj(t);\n      t.collabId = cid;\n      t.collabState = 'en_camino';\n      t.eta = '12 min';\n      COLAB_CHATS[t.id] = COLAB_CHATS[t.id] || [];\n      COLAB_CHATS[t.id].push({ who: 'event', t: 'ahora', text: `ADMIN reasignó el ticket${prev ? ' (antes ' + prev.name + ')' : ''} a ${c.name.toUpperCase()}` });\n      pushNotif('collab', `Ticket ${t.id} reasignado a ${c.name}`, `#${t.id} · ${SERVICES[t.svc].em} ${SERVICES[t.svc].label}`);\n      closeReassign();\n      toast(`Reasignado a ${c.name} ✓`);\n      if (activeChatId === t.id) renderChatPane();\n      const sv = document.getElementById('conv-search');\n      renderChatList(sv ? sv.value : '');\n      saveState();\n    }\n\n    function advancePhase(id) {\n      const t = TICKETS.find(x => x.id === id); if (!t) return;\n      if (t.fase >= 8) { toast('Ticket ya cerrado'); return; }\n      t.fase += 1;\n      toast('Avanzó a fase ' + t.fase + ': ' + PHASES[t.fase - 1].name);\n      // re-render anything visible\n      renderPipeline(); renderTickets(); renderTicketsFull(); renderChatList(document.getElementById('conv-search')?.value || ''); renderChatPane();\n      if (document.getElementById('overlay').classList.contains('is-open')) openTicket(id);\n    }\n\n    /* ───── tickets full table ───── */\n    let tkFilters = { urg: 'all', svc: 'all' };\n    function renderTicketsFull() {\n      const tbody = document.querySelector('#tickets-tbl-full tbody');\n      if (!tbody) return;\n      const list = TICKETS.filter(t => (tkFilters.urg === 'all' || t.urg === tkFilters.urg) && (tkFilters.svc === 'all' || t.svc === tkFilters.svc));\n      document.getElementById('tk-count').textContent = list.length;\n      tbody.innerHTML = list.length === 0 ? '<tr><td colspan=\"7\" class=\"empty-state\">Sin tickets para los filtros seleccionados.<\u002Ftd><\u002Ftr>' : list.map(t => {\n        const s = SERVICES[t.svc]; const ph = PHASES.find(p => p.id === t.fase);\n        return `<tr data-id=\"${t.id}\">\n      <td class=\"col-id\">#${t.id.split('-')[1]}<\u002Ftd>\n      <td><div class=\"cli\">${avatar(t.cliente)}<div class=\"info\"><span class=\"n\">${t.cliente}<\u002Fspan><span class=\"e\">${t.email}<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Ftd>\n      <td><span class=\"pill-svc\" style=\"--sc:${s.color}\"><span class=\"em\">${s.em}<\u002Fspan>${s.label}<\u002Fspan><\u002Ftd>\n      <td><div class=\"progress ph-${t.fase}\">${bars(t.fase)}<span class=\"lbl\">${ph.short}<\u002Fspan><\u002Fdiv><\u002Ftd>\n      <td><span class=\"urg ${t.urg}\" style=\"font-family:Outfit,sans-serif;font-size:10.5px;padding:3px 7px;border-radius:4px;letter-spacing:.04em\">${t.urg === 'emg' ? '🚨 Emergencia' : t.urg === 'day' ? '📅 Mismo día' : '⏱️ Normal'}<\u002Fspan><\u002Ftd>\n      <td style=\"font-size:12px;color:var(--ink-dim)\">${provName(t) || '—'}<\u002Ftd>\n      <td style=\"text-align:right\"><span class=\"price\">${t.monto ? '$' + t.monto.toLocaleString() : '—'}<\u002Fspan><\u002Ftd>\n    <\u002Ftr>`;\n      }).join('');\n      tbody.querySelectorAll('tr[data-id]').forEach(tr => tr.addEventListener('click', () => openTicket(tr.dataset.id)));\n    }\n\n    /* ───── pipeline (full) ───── */\n    function renderPipelineFull() {\n      const target = document.getElementById('pipeline-full');\n      if (!target) return;\n      const grouped = {}; PHASES.forEach(p => grouped[p.id] = []);\n      TICKETS.forEach(t => grouped[t.fase].push(t));\n      target.innerHTML = PHASES.map(p => {\n        const list = grouped[p.id];\n        return `<div class=\"stage\" style=\"--c:${p.color}\">\n      <div class=\"stage-head\"><span class=\"dot\"><\u002Fspan><span class=\"nm\">${String(p.id).padStart(2, '0')} · ${p.short}<\u002Fspan><span class=\"ct\">${list.length}<\u002Fspan><\u002Fdiv>\n      <div class=\"stage-body\">${list.map(t => {\n          const s = SERVICES[t.svc];\n          return `<div class=\"ticket\" data-id=\"${t.id}\">\n          <div class=\"row1\"><span class=\"id\">#${t.id.split('-')[1]}<\u002Fspan><span class=\"urg ${t.urg}\">${t.urg.toUpperCase()}<\u002Fspan><\u002Fdiv>\n          <div class=\"nm\">${t.cliente}<\u002Fdiv>\n          <div class=\"row2\"><span class=\"svc\"><span class=\"em\">${s.em}<\u002Fspan>${s.label}<\u002Fspan><span class=\"pr\">${t.monto ? '$' + t.monto.toLocaleString() : '—'}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>`;\n        }).join('') || '<div style=\"color:var(--ink-mute);font-size:11px;text-align:center;padding:14px 0;font-family:Outfit,sans-serif\">vacío<\u002Fdiv>'}<\u002Fdiv>\n    <\u002Fdiv>`;\n      }).join('');\n      target.querySelectorAll('.ticket').forEach(el => el.addEventListener('click', () => openTicket(el.dataset.id)));\n      renderFlowSvg();\n    }\n\n    /* ───── LIVE FLOW visualization ───── */\n    function renderFlowSvg() {\n      const svg = document.getElementById('flow-svg');\n      if (!svg) return;\n      // node positions — wave layout\n      const nodes = PHASES.map((p, i) => {\n        const x = 90 + i * (1020 / 7);\n        const y = 200 + Math.sin(i * 0.9 - 0.4) * 60;\n        return { ...p, x, y, count: TICKETS.filter(t => t.fase === p.id).length };\n      });\n      // colors for css resolution\n      const colorMap = {\n        'var(--c-start)': '#6ea8fe', 'var(--c-route)': '#b8b3c7', 'var(--c-info)': '#c79bff', 'var(--c-quote)': '#6ee7b7',\n        'var(--c-work)': '#7dd3fc', 'var(--c-check)': '#fbbf24', 'var(--c-pay)': '#f9a8d4', 'var(--c-done)': '#86efac',\n      };\n      nodes.forEach(n => n.cx = colorMap[n.color] || '#7dd3fc');\n\n      // build pipes\n      const pipes = nodes.slice(0, -1).map((a, i) => {\n        const b = nodes[i + 1];\n        // bezier control points\n        const cx1 = a.x + 50, cy1 = a.y;\n        const cx2 = b.x - 50, cy2 = b.y;\n        const d = `M ${a.x} ${a.y} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${b.x} ${b.y}`;\n        const next = nodes[i + 1];\n        return { d, from: a, to: b, id: `pipe-${i}`, color: next.cx };\n      });\n\n      // particle counts based on conversion volumes  (simulate FUNNEL)\n      const conv = [412, 358, 287, 234, 218, 210, 209, 209]; // matches funnel-ish\n      const particleCounts = pipes.map((_, i) => Math.max(2, Math.round(conv[i + 1] / 50)));\n\n      svg.innerHTML = `\n    <defs>\n      <filter id=\"glow\" x=\"-50%\" y=\"-50%\" width=\"200%\" height=\"200%\">\n        <feGaussianBlur stdDeviation=\"3\" result=\"blur\"/>\n        <feMerge><feMergeNode in=\"blur\"/><feMergeNode in=\"SourceGraphic\"/><\u002FfeMerge>\n      <\u002Ffilter>\n      ${nodes.map((n, i) => `\n        <radialGradient id=\"rg-${i}\" cx=\"50%\" cy=\"50%\" r=\"50%\">\n          <stop offset=\"0%\" stop-color=\"${n.cx}\" stop-opacity=\"0.55\"/>\n          <stop offset=\"100%\" stop-color=\"${n.cx}\" stop-opacity=\"0\"/>\n        <\u002FradialGradient>\n        <linearGradient id=\"pipe-grad-${i}\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\">\n          <stop offset=\"0%\" stop-color=\"${nodes[i].cx}\" stop-opacity=\"0.85\"/>\n          <stop offset=\"100%\" stop-color=\"${nodes[Math.min(i + 1, nodes.length - 1)].cx}\" stop-opacity=\"0.85\"/>\n        <\u002FlinearGradient>\n      `).join('')}\n    <\u002Fdefs>\n\n    <!-- pipes (background) -->\n    ${pipes.map((p, i) => `\n      <path id=\"${p.id}\" d=\"${p.d}\" stroke=\"url(#pipe-grad-${i})\" stroke-width=\"2.5\" fill=\"none\" opacity=\"0.35\"/>\n      <path d=\"${p.d}\" stroke=\"url(#pipe-grad-${i})\" stroke-width=\"0.6\" fill=\"none\" opacity=\"0.6\" stroke-dasharray=\"3 5\">\n        <animate attributeName=\"stroke-dashoffset\" from=\"0\" to=\"-16\" dur=\"${2.4 + i * 0.2}s\" repeatCount=\"indefinite\"/>\n      <\u002Fpath>\n    `).join('')}\n\n    <!-- particles flowing through pipes -->\n    ${pipes.map((p, pi) => Array.from({ length: particleCounts[pi] }, (_, j) => {\n        const dur = 5.5 + Math.random() * 2;\n        const begin = -(j * dur / particleCounts[pi]).toFixed(2);\n        return `\n        <circle r=\"3.5\" fill=\"${p.color}\" opacity=\"0.95\" filter=\"url(#glow)\">\n          <animateMotion dur=\"${dur}s\" repeatCount=\"indefinite\" begin=\"${begin}s\">\n            <mpath href=\"#${p.id}\"/>\n          <\u002FanimateMotion>\n        <\u002Fcircle>\n      `;\n      }).join('')).join('')}\n\n    <!-- nodes -->\n    ${nodes.map((n, i) => `\n      <g class=\"flow-node\" data-phase=\"${n.id}\" style=\"color:${n.cx}\" transform=\"translate(${n.x},${n.y})\">\n        <circle r=\"55\" fill=\"url(#rg-${i})\"/>\n        <circle class=\"ring\" r=\"38\" fill=\"rgba(10,12,20,0.85)\" stroke=\"${n.cx}\" stroke-width=\"2\"/>\n        <circle r=\"38\" fill=\"${n.cx}\" opacity=\"0.06\"/>\n        <text y=\"-4\" text-anchor=\"middle\" font-family=\"Outfit, sans-serif\" font-weight=\"800\" font-size=\"28\" fill=\"${n.cx}\" letter-spacing=\"-0.5\">${n.count}<\u002Ftext>\n        <text y=\"14\" text-anchor=\"middle\" font-family=\"Outfit, sans-serif\" font-weight=\"500\" font-size=\"9\" fill=\"${n.cx}\" letter-spacing=\"1.2\" opacity=\"0.85\">${String(n.id).padStart(2, '0')}<\u002Ftext>\n        <text y=\"68\" text-anchor=\"middle\" font-family=\"Outfit, sans-serif\" font-weight=\"500\" font-size=\"11\" fill=\"rgba(244,245,248,0.9)\" letter-spacing=\"0.5\" font-weight=\"600\">${n.short.toUpperCase()}<\u002Ftext>\n      <\u002Fg>\n    `).join('')}\n  `;\n\n      // click node = scroll kanban to that column\n      svg.querySelectorAll('.flow-node').forEach(g => g.addEventListener('click', () => {\n        const id = parseInt(g.dataset.phase);\n        document.querySelectorAll('.flow-node').forEach(x => x.classList.toggle('is-on', parseInt(x.dataset.phase) === id));\n        const stages = document.querySelectorAll('#pipeline-full .stage');\n        if (stages[id - 1]) {\n          stages[id - 1].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });\n          stages[id - 1].animate([{ boxShadow: '0 0 0 0 rgba(110,168,254,0.6)' }, { boxShadow: '0 0 0 6px rgba(110,168,254,0)' }], { duration: 1200 });\n        }\n        toast(`Fase ${id}: ${PHASES[id - 1].name} · ${TICKETS.filter(t => t.fase === id).length} tickets`);\n      }));\n    }\n\n\n    /* ───── COLABORADORES ───── */\n    const STATES = [\n      { id: 'en_camino', em: '🚗', label: 'En camino' },\n      { id: 'en_proceso', em: '🔧', label: 'En proceso' },\n      { id: 'por_terminar', em: '⏳', label: 'Por terminar' },\n      { id: 'finalizado', em: '✅', label: 'Finalizado' },\n    ];\n    const PENDING = [\n      { id: '2024-1252', cliente: 'Hotel Real Maya', svc: 'plomeria', urg: 'emg', precio: 3200, dist: '2.4 km' },\n      { id: '2024-1253', cliente: 'Spa Aurora', svc: 'plomeria', urg: 'day', precio: 1600, dist: '6.1 km' },\n      { id: '2024-1254', cliente: 'Andrés Sosa', svc: 'plomeria', urg: 'norm', precio: 980, dist: '9.0 km' },\n    ];\n\n    let activeCol = 'jg';\n    let phoneTab = 'inicio';\n\n    function findActiveTicket(c) {\n      return c.activeTicket ? TICKETS.find(x => x.id === c.activeTicket) || { id: c.activeTicket, cliente: 'Cliente', urg: 'norm', precio: 0, ubic: '', eta: '', desc: '' } : null;\n    }\n\n    function renderColList(filter = '') {\n      const f = filter.toLowerCase();\n      const list = Object.values(COLLABS).filter(c => !f || c.name.toLowerCase().includes(f) || SERVICES[c.svc].label.toLowerCase().includes(f) || c.zone.toLowerCase().includes(f));\n      const activeCt = document.getElementById('col-active-sub'); if (activeCt) activeCt.textContent = `// ${Object.values(COLLABS).filter(c => c.status !== 'off').length} activos`;\n      const countEl = document.getElementById('col-count'); if (countEl) countEl.textContent = Object.values(COLLABS).filter(c => c.status !== 'off').length;\n\n      const target = document.getElementById('col-list');\n      if (target) {\n        target.innerHTML = list.map(c => {\n          const s = SERVICES[c.svc];\n          return `<div class=\"col-row ${c.id === activeCol ? 'is-on' : ''}\" data-id=\"${c.id}\">\n        <div class=\"ax\" style=\"background:linear-gradient(135deg,${c.av1},${c.av2})\">\n          ${c.initials}\n          <span class=\"st ${c.status}\" title=\"${statusLabel(c.status)}\"><\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"info\">\n          <div class=\"nm\">${c.name}<\u002Fdiv>\n          <div class=\"meta\">${s.em} ${s.label} · ${c.zone}<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"stars\">\n          <span>★ ${c.rating.toFixed(1)}<\u002Fspan>\n          <small>${c.jobs} trabajos<\u002Fsmall>\n        <\u002Fdiv>\n      <\u002Fdiv>`;\n        }).join('') || '<div style=\"padding:24px;text-align:center;color:var(--ink-faint);font-size:12px\">Sin resultados<\u002Fdiv>';\n\n        target.querySelectorAll('.col-row').forEach(r => r.addEventListener('click', () => { activeCol = r.dataset.id; phoneTab = 'inicio'; renderAllCol(); }));\n      }\n    }\n\n    function renderPhoneHead(c) {\n      const greet = c.name.split(' ')[0];\n      const target = document.getElementById('ph-head');\n      if (target) target.innerHTML = `\n    <div>\n      <div class=\"greet\">Hola, <em>${greet}<\u002Fem>.<small>Buenas tardes · ${new Date().toLocaleDateString('es-MX', { weekday: 'short', day: 'numeric', month: 'short' })}<\u002Fsmall><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"av\" style=\"background:linear-gradient(135deg,${c.av1},${c.av2})\">${c.initials}<\u002Fdiv>\n  `;\n    }\n\n    function renderPhoneInicio(c) {\n      const t = findActiveTicket(c);\n      const s = SERVICES[c.svc];\n      const stIdx = c.state ? STATES.findIndex(x => x.id === c.state) : -1;\n\n      const clockBlock = `\n    <div class=\"clock-card\">\n      <div>\n        <div class=\"l\">Estado<\u002Fdiv>\n        <div class=\"v\">${c.clockedIn ? 'En turno' : 'Fuera'}${c.clockedInAt ? `<small>desde ${c.clockedInAt}<\u002Fsmall>` : ''}<\u002Fdiv>\n        ${c.clockedIn ? `<div class=\"ind\"><span class=\"dot\"><\u002Fspan>Sesión activa<\u002Fdiv>` : ''}\n      <\u002Fdiv>\n      <button id=\"ph-clock\" class=\"${c.clockedIn ? 'is-off' : ''}\">${c.clockedIn ? 'Cerrar turno' : 'Iniciar turno'}<\u002Fbutton>\n    <\u002Fdiv>\n  `;\n\n      const activeBlock = t ? `\n    <div class=\"active-card\">\n      <span class=\"badge\"><span class=\"d\"><\u002Fspan>Servicio activo<\u002Fspan>\n      <h3>${t.desc || 'Servicio en curso'}<\u002Fh3>\n      <div class=\"who\">${t.cliente} · #${t.id.split('-')[1]}<\u002Fdiv>\n      <div class=\"row\"><span class=\"k\">Servicio<\u002Fspan><span class=\"v\">${s.em} ${s.label}<\u002Fspan><\u002Fdiv>\n      <div class=\"row\"><span class=\"k\">Ubicación<\u002Fspan><span class=\"v\">${t.ubic}<\u002Fspan><\u002Fdiv>\n      <div class=\"row\"><span class=\"k\">Urgencia<\u002Fspan><span class=\"v\">${t.urg === 'emg' ? '🚨 Emergencia' : t.urg === 'day' ? '📅 Mismo día' : '⏱️ Normal'}<\u002Fspan><\u002Fdiv>\n      <div class=\"row\"><span class=\"k\">Tu pago<\u002Fspan><span class=\"v\">$${Math.round((t.precio || t.monto || 0) * 0.55).toLocaleString()} MXN<\u002Fspan><\u002Fdiv>\n\n      <div class=\"p-track\">\n        <div class=\"p-steps\">\n          ${STATES.map((x, i) => `<span class=\"s ${i < stIdx ? 'on' : i === stIdx ? 'cur' : 'next'}\"><\u002Fspan>`).join('')}\n        <\u002Fdiv>\n        <div class=\"p-step-lbl\">\n          <span>Inicio<\u002Fspan>\n          ${stIdx >= 0 ? `<span class=\"cur\">${STATES[stIdx].em} ${STATES[stIdx].label}<\u002Fspan>` : `<span>Sin asignar<\u002Fspan>`}\n          <span>Cierre<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"state-grid\">\n        ${STATES.map((x, i) => `\n          <button class=\"state-btn ${i < stIdx ? 'is-done' : i === stIdx ? 'is-on' : 'is-future'}\" data-state=\"${x.id}\">\n            <span class=\"em\">${x.em}<\u002Fspan>${x.label}\n          <\u002Fbutton>`).join('')}\n      <\u002Fdiv>\n    <\u002Fdiv>\n  ` : `\n    <div class=\"active-card\">\n      <span class=\"badge\" style=\"background:#f3f4f6;color:#6b7080\"><span class=\"d\" style=\"background:#6b7080\"><\u002Fspan>Sin servicio activo<\u002Fspan>\n      <h3>Listo para el siguiente trabajo<\u002Fh3>\n      <div class=\"who\">${c.zone} · disponible para asignación<\u002Fdiv>\n    <\u002Fdiv>\n  `;\n\n      const pendingBlock = (!t && c.clockedIn) ? `\n    <div style=\"font:600 10px/1 Outfit,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--p-ink-f);padding: 4px 4px 0\">Cerca de ti<\u002Fdiv>\n    <div class=\"order-list\">\n      ${PENDING.slice(0, 3).map(p => {\n        const ps = SERVICES[p.svc];\n        return `<div class=\"order-card\">\n          <div class=\"top\"><span class=\"id\">#${p.id.split('-')[1]}<\u002Fspan><span class=\"urg ${p.urg}\">${p.urg === 'emg' ? '🚨 EMG' : p.urg === 'day' ? '📅 HOY' : '⏱️ NORM'}<\u002Fspan><\u002Fdiv>\n          <div class=\"who\">${p.cliente}<\u002Fdiv>\n          <div class=\"meta\"><span class=\"svc\">${ps.em} ${ps.label}<\u002Fspan> · <span>${p.dist}<\u002Fspan> · <span class=\"price\" style=\"font-size:11px\">$${p.precio.toLocaleString()}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>`;\n      }).join('')}\n    <\u002Fdiv>\n  ` : '';\n\n      return clockBlock + activeBlock + pendingBlock;\n    }\n\n    function renderPhoneOrdenes(c) {\n      return `\n    <div style=\"font:600 10px/1 Outfit,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--p-ink-f);padding: 4px 4px 0\">Hoy · ${c.jobsMonth > 10 ? '4' : '2'} órdenes<\u002Fdiv>\n    <div class=\"order-list\">\n      ${(findActiveTicket(c) ? [findActiveTicket(c)] : []).concat(PENDING.slice(0, 3)).map(t => {\n        const ps = SERVICES[t.svc];\n        return `<div class=\"order-card\">\n          <div class=\"top\"><span class=\"id\">#${t.id.split('-')[1]}<\u002Fspan><span class=\"urg ${t.urg}\">${t.urg === 'emg' ? '🚨 EMG' : t.urg === 'day' ? '📅 HOY' : '⏱️ NORM'}<\u002Fspan><\u002Fdiv>\n          <div class=\"who\">${t.cliente}<\u002Fdiv>\n          <div class=\"meta\"><span class=\"svc\">${ps.em} ${ps.label}<\u002Fspan>${t.ubic ? ' · <span>' + t.ubic + '<\u002Fspan>' : ''}<\u002Fdiv>\n          <div class=\"top\" style=\"margin-top:2px\"><span style=\"font-size:10.5px;color:var(--p-ink-f)\">${t.desc ? t.desc.substring(0, 40) + '…' : 'Sin descripción'}<\u002Fspan><span class=\"price\">$${(t.precio || t.monto || 0).toLocaleString()}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>`;\n      }).join('')}\n    <\u002Fdiv>\n\n    <div style=\"font:600 10px/1 Outfit,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--p-ink-f);padding: 8px 4px 0\">Esta semana<\u002Fdiv>\n    <div class=\"order-list\">\n      <div class=\"order-card\" style=\"opacity:.7\">\n        <div class=\"top\"><span class=\"id\">#1238<\u002Fspan><span class=\"urg norm\">✓ COMPLETADO<\u002Fspan><\u002Fdiv>\n        <div class=\"who\">Cliente anterior<\u002Fdiv>\n        <div class=\"meta\"><span>Servicio entregado · Lunes<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"order-card\" style=\"opacity:.7\">\n        <div class=\"top\"><span class=\"id\">#1235<\u002Fspan><span class=\"urg norm\">✓ COMPLETADO<\u002Fspan><\u002Fdiv>\n        <div class=\"who\">Otro cliente<\u002Fdiv>\n        <div class=\"meta\"><span>Servicio entregado · Domingo<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  `;\n    }\n\n    function renderPhonePagos(c) {\n      return `\n    <div class=\"earn-hero\">\n      <div class=\"l\">Ganado este mes<\u002Fdiv>\n      <div class=\"v\">$${c.earnedMonth.toLocaleString()}<\u002Fdiv>\n      <div class=\"d\">+ $${c.earnedWeek.toLocaleString()} esta semana<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"earn-row\">\n      <div class=\"k\"><b>Hoy<\u002Fb><small>${c.jobsMonth > 10 ? '3' : '1'} servicios<\u002Fsmall><\u002Fdiv>\n      <div class=\"v\">$${c.earnedToday.toLocaleString()}<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"earn-row\">\n      <div class=\"k\"><b>Esta semana<\u002Fb><small>${c.jobsMonth > 10 ? '8' : '4'} servicios<\u002Fsmall><\u002Fdiv>\n      <div class=\"v\">$${c.earnedWeek.toLocaleString()}<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"earn-row\">\n      <div class=\"k\"><b>Este mes<\u002Fb><small>${c.jobsMonth} servicios<\u002Fsmall><\u002Fdiv>\n      <div class=\"v\">$${c.earnedMonth.toLocaleString()}<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"earn-row\" style=\"background:#1a1d28;color:#fff;border-color:#1a1d28\">\n      <div class=\"k\"><b style=\"color:#fff\">Próximo depósito<\u002Fb><small style=\"color:rgba(255,255,255,0.55)\">Viernes 24 de mayo<\u002Fsmall><\u002Fdiv>\n      <div class=\"v\" style=\"color:#86efac\">$${(c.earnedWeek + 200).toLocaleString()}<\u002Fdiv>\n    <\u002Fdiv>\n  `;\n    }\n\n    function renderPhonePerfil(c) {\n      const s = SERVICES[c.svc];\n      return `\n    <div class=\"prof-card\">\n      <div class=\"pav\" style=\"background:linear-gradient(135deg,${c.av1},${c.av2})\">${c.initials}<\u002Fdiv>\n      <div class=\"info\">\n        <div class=\"n\">${c.name}<\u002Fdiv>\n        <div class=\"m\">${s.em} ${s.label} · ${c.zone}<\u002Fdiv>\n        <div class=\"rating\">★ ${c.rating.toFixed(1)} · ${c.jobs} servicios<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"prof-field\"><span class=\"k\">Teléfono<\u002Fspan><span class=\"v\">${c.phone}<\u002Fspan><\u002Fdiv>\n    <div class=\"prof-field\"><span class=\"k\">Vehículo<\u002Fspan><span class=\"v\">${c.vehicle}<\u002Fspan><\u002Fdiv>\n    <div class=\"prof-field\"><span class=\"k\">Zona principal<\u002Fspan><span class=\"v\">${c.zone}<\u002Fspan><\u002Fdiv>\n    <div class=\"prof-field\"><span class=\"k\">Registrado<\u002Fspan><span class=\"v\">${c.registered}<\u002Fspan><\u002Fdiv>\n    <div class=\"prof-field\"><span class=\"k\" style=\"align-self:flex-start;padding-top:2px\">Certificaciones<\u002Fspan><span class=\"v\" style=\"text-align:right\">${c.certifications.map(x => '✓ ' + x).join('<br/>')}<\u002Fspan><\u002Fdiv>\n    <div class=\"prof-foot\">\n      <button>Editar datos<\u002Fbutton>\n      <button>Documentos<\u002Fbutton>\n      <button class=\"danger\">Cerrar sesión<\u002Fbutton>\n    <\u002Fdiv>\n  `;\n    }\n\n    function renderPhone() {\n      const c = COLLABS[activeCol];\n      if (!c) return;\n      renderPhoneHead(c);\n      const body = document.getElementById('ph-body');\n      if (!body) return;\n\n      body.innerHTML =\n        phoneTab === 'inicio' ? renderPhoneInicio(c) :\n          phoneTab === 'ordenes' ? renderPhoneOrdenes(c) :\n            phoneTab === 'pagos' ? renderPhonePagos(c) : renderPhonePerfil(c);\n\n      document.querySelectorAll('#ph-tabs .tab').forEach(t => t.classList.toggle('is-on', t.dataset.tab === phoneTab));\n\n      const clockBtn = document.getElementById('ph-clock');\n      if (clockBtn) clockBtn.onclick = () => {\n        c.clockedIn = !c.clockedIn;\n        if (c.clockedIn) { c.clockedInAt = new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', hour12: false }); c.status = 'act'; }\n        else { c.status = 'off'; }\n        toast(c.clockedIn ? 'Turno iniciado' : 'Turno cerrado');\n        renderAllCol();\n      };\n\n      document.querySelectorAll('.state-btn').forEach(b => b.onclick = () => {\n        const newSt = b.dataset.state;\n        const ord = STATES.findIndex(x => x.id === newSt);\n        c.state = newSt;\n        c.status = newSt === 'en_camino' ? 'route' : newSt === 'finalizado' ? 'act' : 'work';\n        toast(`Estado actualizado: ${STATES[ord].label}`);\n        renderAllCol();\n      });\n    }\n\n    function renderActivity() {\n      const c = COLLABS[activeCol];\n      if (!c) return;\n      const t = findActiveTicket(c);\n      const s = SERVICES[c.svc];\n\n      const title = document.getElementById('act-title');\n      if (title) title.innerHTML = `${c.name} <span style=\"font-family:Outfit,sans-serif;font-size:10px;color:var(--ink-faint);letter-spacing:.08em;margin-left:6px\">// ${statusLabel(c.status).toUpperCase()}<\u002Fspan>`;\n\n      const body = document.getElementById('activity-body');\n      if (!body) return;\n\n      body.innerHTML = `\n    <div style=\"padding:12px 14px;border-radius:12px;background:color-mix(in oklab, var(--c-work) 8%, var(--bg-1));border:1px dashed color-mix(in oklab, var(--c-work) 35%, var(--line));display:flex;align-items:center;gap:12px\">\n      <span style=\"width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:color-mix(in oklab, var(--c-work) 20%, transparent);color:var(--c-work);font-size:14px;flex:none\">✸<\u002Fspan>\n      <div style=\"flex:1;min-width:0\">\n        <div style=\"font-size:12.5px;color:var(--ink);font-weight:500\">Las conversaciones viven en el
