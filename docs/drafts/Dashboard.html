ticket<\u002Fdiv>\n        <div style=\"font-size:11px;color:var(--ink-dim);margin-top:2px;line-height:1.4\">Para chatear con ${c.name.split(' ')[0]} sobre un servicio, abre el workspace del ticket. Ahi ves cliente, colaborador y mapa juntos.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    ${t ? `\n      <div>\n        <div style=\"font-family:Outfit,sans-serif;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px;padding-left:2px\">Ticket activo<\u002Fdiv>\n        <div class=\"ticket-link\" data-tid=\"${t.id}\" style=\"background:linear-gradient(180deg,color-mix(in oklab, var(--c-work) 8%, var(--bg-2)),var(--bg-1));border:1px solid color-mix(in oklab, var(--c-work) 28%, var(--line));border-radius:14px;padding:14px;cursor:pointer;transition:all .2s ease\" onmouseover=\"this.style.borderColor='color-mix(in oklab,var(--c-work) 55%, var(--line))'\" onmouseout=\"this.style.borderColor='color-mix(in oklab,var(--c-work) 28%, var(--line))'\">\n          <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:8px\">\n            <span style=\"font-family:Outfit,sans-serif;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--c-work);padding:3px 8px;border-radius:999px;background:color-mix(in oklab,var(--c-work) 14%,transparent);border:1px solid color-mix(in oklab,var(--c-work) 32%,transparent)\">● En curso<\u002Fspan>\n            <span style=\"font-family:Outfit,sans-serif;font-size:10.5px;color:var(--ink-faint);margin-left:auto\">#${t.id.split('-')[1]}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:15px;font-weight:600;line-height:1.25;margin-bottom:4px\">${t.desc || 'Servicio en curso'}<\u002Fdiv>\n          <div style=\"font-size:12px;color:var(--ink-dim);font-family:Outfit,sans-serif;margin-bottom:10px\">${t.cliente} · ${SERVICES[t.svc].em} ${SERVICES[t.svc].label}<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:11.5px\">\n            <div style=\"padding:6px 8px;background:var(--bg-0);border:1px solid var(--line);border-radius:8px\"><div style=\"font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-family:Outfit,sans-serif;margin-bottom:2px\">Ubicación<\u002Fdiv><div>${t.ubic}<\u002Fdiv><\u002Fdiv>\n            <div style=\"padding:6px 8px;background:var(--bg-0);border:1px solid var(--line);border-radius:8px\"><div style=\"font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-family:Outfit,sans-serif;margin-bottom:2px\">ETA<\u002Fdiv><div style=\"color:var(--c-work);font-weight:600\">${t.eta}<\u002Fdiv><\u002Fdiv>\n            <div style=\"padding:6px 8px;background:var(--bg-0);border:1px solid var(--line);border-radius:8px\"><div style=\"font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-family:Outfit,sans-serif;margin-bottom:2px\">Monto<\u002Fdiv><div style=\"font-family:Outfit,sans-serif;font-weight:700\">$${(t.precio || t.monto || 0).toLocaleString()}<\u002Fdiv><\u002Fdiv>\n            <div style=\"padding:6px 8px;background:var(--bg-0);border:1px solid var(--line);border-radius:8px\"><div style=\"font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-family:Outfit,sans-serif;margin-bottom:2px\">Urgencia<\u002Fdiv><div>${t.urg === 'emg' ? '🚨 Emergencia' : t.urg === 'day' ? '📅 Mismo día' : '⏱️ Normal'}<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <button style=\"width:100%;margin-top:10px;padding:9px;border-radius:9px;cursor:pointer;background:color-mix(in oklab,var(--c-work) 16%,transparent);border:1px solid color-mix(in oklab,var(--c-work) 40%,transparent);color:var(--c-work);font:600 11.5px/1 Outfit,sans-serif;letter-spacing:.04em\" onclick=\"activeChatId='${t.id}'; switchView('conversaciones')\">Abrir workspace del ticket →<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    ` : `\n      <div>\n        <div style=\"font-family:Outfit,sans-serif;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px;padding-left:2px\">Ticket activo<\u002Fdiv>\n        <div style=\"padding:18px;border-radius:14px;border:1px dashed var(--line);text-align:center;color:var(--ink-faint);font-size:12.5px\">${c.clockedIn ? 'Disponible — sin servicio asignado' : 'Fuera de turno'}<\u002Fdiv>\n      <\u002Fdiv>\n    `}\n\n    <div>\n      <div style=\"font-family:Outfit,sans-serif;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px;padding-left:2px\">Performance · 30d<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:8px\">\n        <div style=\"padding:12px;background:var(--bg-1);border:1px solid var(--line);border-radius:12px\"><div style=\"font-family:Outfit,sans-serif;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)\">Rating<\u002Fdiv><div style=\"font-family:Outfit,sans-serif;font-size:24px;letter-spacing:-.01em;color:var(--c-check);margin-top:2px\">★ ${c.rating.toFixed(1)}<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding:12px;background:var(--bg-1);border:1px solid var(--line);border-radius:12px\"><div style=\"font-family:Outfit,sans-serif;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)\">Servicios<\u002Fdiv><div style=\"font-family:Outfit,sans-serif;font-size:24px;letter-spacing:-.01em;margin-top:2px\">${c.jobsMonth}<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding:12px;background:var(--bg-1);border:1px solid var(--line);border-radius:12px\"><div style=\"font-family:Outfit,sans-serif;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)\">Ingresos<\u002Fdiv><div style=\"font-family:Outfit,sans-serif;font-size:22px;letter-spacing:-.01em;color:var(--c-quote);margin-top:2px\">$${(c.earnedMonth / 1000).toFixed(1)}k<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div>\n      <div style=\"font-family:Outfit,sans-serif;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px;padding-left:2px\">Tickets recientes<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:6px\">\n        ${[\n          { id: '1238', cl: 'Liliana Cano', svc: s.label, day: 'Lunes', amt: Math.round(c.earnedMonth * 0.08) },\n          { id: '1234', cl: 'Refugio Torres', svc: s.label, day: 'Domingo', amt: Math.round(c.earnedMonth * 0.10) },\n          { id: '1229', cl: 'Tienda Mercurio', svc: s.label, day: 'Viernes', amt: Math.round(c.earnedMonth * 0.12) },\n          { id: '1222', cl: 'Carlos Benítez', svc: s.label, day: 'Miércoles', amt: Math.round(c.earnedMonth * 0.07) },\n        ].map(r => `\n          <div style=\"display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg-1);border:1px solid var(--line);border-radius:10px\">\n            <span style=\"width:6px;height:6px;border-radius:50%;background:var(--c-done);box-shadow:0 0 6px var(--c-done)\"><\u002Fspan>\n            <span style=\"font-family:Outfit,sans-serif;font-size:10.5px;color:var(--ink-faint);min-width:50px\">#${r.id}<\u002Fspan>\n            <div style=\"flex:1;min-width:0\">\n              <div style=\"font-size:12.5px;font-weight:500;text-overflow:ellipsis;overflow:hidden;white-space:nowrap\">${r.cl}<\u002Fdiv>\n              <div style=\"font-size:10.5px;color:var(--ink-faint);font-family:Outfit,sans-serif\">${s.em} ${r.svc} · ${r.day}<\u002Fdiv>\n            <\u002Fdiv>\n            <span style=\"font-family:Outfit,sans-serif;font-size:11.5px;font-weight:600;color:var(--ink-dim)\">$${r.amt.toLocaleString()}<\u002Fspan>\n          <\u002Fdiv>\n        `).join('')}\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div>\n      <div style=\"font-family:Outfit,sans-serif;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px;padding-left:2px\">Contacto directo<\u002Fdiv>\n      <div style=\"display:flex;gap:6px\">\n        <button style=\"flex:1;padding:10px;background:var(--bg-1);border:1px solid var(--line);border-radius:10px;color:var(--ink-dim);cursor:pointer;font:500 11.5px/1 Outfit,sans-serif;letter-spacing:.04em\" id=\"act-call-2\">📞 ${c.phone}<\u002Fbutton>\n        <button style=\"flex:1;padding:10px;background:var(--bg-1);border:1px solid var(--line);border-radius:10px;color:var(--ink-dim);cursor:pointer;font:500 11.5px/1 Outfit,sans-serif;letter-spacing:.04em\" id=\"act-wa\">💬 WhatsApp<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  `;\n\n      document.querySelectorAll('.ticket-link').forEach(el => el.addEventListener('click', e => {\n        if (e.target.tagName === 'BUTTON') return;\n        activeChatId = el.dataset.tid;\n        switchView('conversaciones');\n      }));\n      const c2 = document.getElementById('act-call-2'); if (c2) c2.onclick = () => toast('Iniciando llamada…');\n      const wa = document.getElementById('act-wa'); if (wa) wa.onclick = () => toast('Abriendo WhatsApp…');\n    }\n\n    function renderAllCol() {\n      const el = document.getElementById('col-search');\n      renderColList(el ? el.value : '');\n      renderPhone();\n      renderActivity();\n    }\n\n    /* ───── view switching ───── */\n    function switchView(view) {\n      document.querySelectorAll('[data-page]').forEach(p => p.classList.toggle('is-on', p.dataset.page === view));\n      document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('is-active', n.dataset.view === view));\n      if (view === 'conversaciones') { renderChatList(); renderChatPane(); }\n      if (view === 'tickets') { renderTicketsFull(); }\n      if (view === 'pipeline') { renderPipelineFull(); }\n      if (view === 'clientes') { renderClientes(); }\n      if (view === 'colaboradores') { renderAllCol(); }\n      if (view === 'servicios') { renderServicios(); }\n      if (view === 'reportes') { renderReportes(); }\n      if (view === 'calendario') { renderCalendario(); }\n      if (view === 'pagos') { renderPagos(); }\n      if (view === 'facturacion') { renderFacturacion(); }\n      if (view === 'settings') { wireSettings(); }\n      // breadcrumb\n      const labels = {\n        dashboard: ['Operación', 'Dashboard'],\n        conversaciones: ['Operación', 'Conversaciones'],\n        tickets: ['Operación', 'Tickets'],\n        pipeline: ['Operación', 'Pipeline'],\n        clientes: ['Catálogo', 'Clientes'],\n        colaboradores: ['Catálogo', 'Colaboradores'],\n        servicios: ['Catálogo', 'Servicios y precios'],\n        calendario: ['Catálogo', 'Calendario'],\n        pagos: ['Finanzas', 'Pagos'],\n        reportes: ['Finanzas', 'Reportes'],\n        facturacion: ['Finanzas', 'Facturación'],\n        settings: ['Sistema', 'Configuración'],\n      };\n      const [section, label] = labels[view] || ['', view];\n      document.querySelector('.crumb').innerHTML = `<b>${section}<\u002Fb> <span class=\"sep\">/<\u002Fspan> ${label}`;\n    }\n\n    /* ───── toast ───── */\n    let toastEl;\n    function toast(msg) {\n      if (!toastEl) { toastEl = document.createElement('div'); toastEl.className = 'toast'; document.body.appendChild(toastEl); }\n      toastEl.innerHTML = '<span class=\"dot\"><\u002Fspan> ' + msg;\n      toastEl.classList.add('is-on');\n      clearTimeout(window._toastT);\n      window._toastT = setTimeout(() => toastEl.classList.remove('is-on'), 2200);\n    }\n\n    /* ───── new ticket modal ───── */\n    function openNewTicket() {\n      const ph = PHASES[0];\n      sheet.style.setProperty('--c', ph.color);\n      sheet.dataset.cat = 'action';\n      sheet.querySelector('[data-r=\"tag\"]').textContent = 'Nuevo ticket';\n      sheet.querySelector('[data-r=\"id\"]').textContent = '#NUEVO';\n      sheet.querySelector('[data-r=\"title\"]').textContent = 'Crear ticket manual';\n      sheet.querySelector('[data-r=\"body\"]').innerHTML = `\n    <div class=\"form-grid\">\n      <div class=\"field\"><label>Nombre del cliente<\u002Flabel><input id=\"nt-name\" placeholder=\"Mariana Cervantes\"/><\u002Fdiv>\n      <div class=\"field\"><label>Correo<\u002Flabel><input id=\"nt-email\" placeholder=\"cliente@email.com\"/><\u002Fdiv>\n      <div class=\"field\"><label>Servicio<\u002Flabel><select id=\"nt-svc\">${Object.entries(SERVICES).map(([k, v]) => `<option value=\"${k}\">${v.em} ${v.label}<\u002Foption>`).join('')}<\u002Fselect><\u002Fdiv>\n      <div class=\"field\"><label>Urgencia<\u002Flabel><select id=\"nt-urg\"><option value=\"norm\">⏱️ Normal<\u002Foption><option value=\"day\">📅 Mismo día<\u002Foption><option value=\"emg\">🚨 Emergencia<\u002Foption><\u002Fselect><\u002Fdiv>\n      <div class=\"field\"><label>Ubicación<\u002Flabel><input id=\"nt-ubic\" placeholder=\"Apartamento, oficina…\"/><\u002Fdiv>\n      <div class=\"field\"><label>Monto estimado<\u002Flabel><input id=\"nt-monto\" type=\"number\" placeholder=\"0\"/><\u002Fdiv>\n    <\u002Fdiv>`;\n      document.querySelector('.sheet-foot').innerHTML = '<button id=\"nt-cancel\">Cancelar<\u002Fbutton><button class=\"open-chat\" id=\"nt-create\">Crear ticket →<\u002Fbutton>';\n      document.getElementById('nt-cancel').onclick = closeSheet;\n      document.getElementById('nt-create').onclick = () => {\n        const name = document.getElementById('nt-name').value.trim() || 'Cliente sin nombre';\n        const t = {\n          id: '2024-' + (1248 + TICKETS.filter(x => x.id.startsWith('2024-12')).length),\n          cliente: name,\n          email: document.getElementById('nt-email').value.trim() || 'sin@correo.mx',\n          svc: document.getElementById('nt-svc').value,\n          fase: 1,\n          urg: document.getElementById('nt-urg').value,\n          monto: Number(document.getElementById('nt-monto').value) || 0,\n          ubic: document.getElementById('nt-ubic').value.trim() || '—',\n          prov: '—', iniciado: new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', hour12: false }), eta: 'pendiente'\n        };\n        TICKETS.unshift(t);\n        closeSheet();\n        toast('Ticket #' + t.id + ' creado');\n        renderPipeline(); renderTickets(); renderTicketsFull(); renderPipelineFull(); renderChatList();\n      };\n      overlay.classList.add('is-open');\n      document.body.style.overflow = 'hidden';\n    }\n\n    /* augment openTicket to add Advance button */\n    const _origOpen = openTicket;\n    openTicket = function (id) {\n      _origOpen(id);\n      const t = TICKETS.find(x => x.id === id); if (!t) return;\n      document.querySelector('.sheet-foot').innerHTML = `\n    <button id=\"sf-reasign\">Reasignar colaborador<\u002Fbutton>\n    <button id=\"sf-edit\">Editar presupuesto<\u002Fbutton>\n    <button class=\"advance\" id=\"sf-advance\" ${t.fase >= 8 ? 'disabled style=\"opacity:.4;cursor:not-allowed\"' : ''}>Avanzar fase ▶<\u002Fbutton>\n    <button class=\"open-chat\" id=\"sf-chat\">Abrir conversación →<\u002Fbutton>`;\n      document.getElementById('sf-reasign').onclick = () => { closeSheet(); openReassign(t); };\n      document.getElementById('sf-edit').onclick = () => toast('Edición de presupuesto próximamente');\n      const adv = document.getElementById('sf-advance');\n      if (adv && t.fase < 8) adv.onclick = () => advancePhase(id);\n      document.getElementById('sf-chat').onclick = () => { closeSheet(); activeChatId = id; switchView('conversaciones'); };\n    };\n\n    /* ───── persistence ───── */\n    const LS_KEY = 'yessyfy_admin_v2';\n    function saveState() {\n      try {\n        const slim = {\n          tickets: TICKETS.map(t => ({ id: t.id, fase: t.fase, collabId: t.collabId, collabState: t.collabState })),\n          colabChats: COLAB_CHATS,\n          notifs: NOTIFS.slice(0, 50),\n        };\n        localStorage.setItem(LS_KEY, JSON.stringify(slim));\n      } catch (e) { }\n    }\n    function loadState() {\n      try {\n        const raw = localStorage.getItem(LS_KEY);\n        if (!raw) return;\n        const s = JSON.parse(raw);\n        if (s.tickets) s.tickets.forEach(saved => {\n          const t = TICKETS.find(x => x.id === saved.id);\n          if (t) { t.fase = saved.fase; if (saved.collabId !== undefined) t.collabId = saved.collabId; if (saved.collabState !== undefined) t.collabState = saved.collabState; }\n        });\n        if (s.colabChats) Object.assign(COLAB_CHATS, s.colabChats);\n        if (s.notifs) NOTIFS.push(...s.notifs);\n      } catch (e) { console.warn('loadState failed', e); }\n    }\n\n    /* ───── notifications ───── */\n    const NOTIFS = [];\n    function pushNotif(kind, title, meta) {\n      const colorMap = { phase: 'var(--c-start)', new: 'var(--c-quote)', collab: 'var(--c-work)', alert: 'var(--c-error)', pay: 'var(--c-pay)' };\n      const iconMap = { phase: '▶', new: '✦', collab: '⚒', alert: '!', pay: '$' };\n      NOTIFS.unshift({\n        id: Date.now() + Math.random(),\n        kind, title, meta,\n        time: new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', hour12: false }),\n        read: false,\n        color: colorMap[kind] || 'var(--c-start)',\n        icon: iconMap[kind] || '●',\n      });\n      if (NOTIFS.length > 50) NOTIFS.length = 50;\n      renderNotifs();\n      saveState();\n    }\n    function renderNotifs() {\n      const unread = NOTIFS.filter(n => !n.read).length;\n      const pip = document.getElementById('notif-pip');\n      if (pip) pip.style.display = unread ? '' : 'none';\n      const list = document.getElementById('notif-list');\n      if (!list) return;\n      document.getElementById('notif-count').textContent = `// ${NOTIFS.length} eventos · ${unread} nuevos`;\n      list.innerHTML = NOTIFS.length === 0\n        ? '<div class=\"notif-empty\">Sin notificaciones todavía.<\u002Fdiv>'\n        : NOTIFS.map(n => `\n      <div class=\"notif-item ${n.read ? '' : 'is-new'}\" data-id=\"${n.id}\" style=\"--c:${n.color}\">\n        <span class=\"ic\">${n. bl\">✦ Nuevos 30d<\u002Fspan>\n        <div class=\"bar\"><div class=\"fill\" style=\"width:18%\"><\u002Fdiv><\u002Fdiv>\n        <span class=\"v\">$1.1k<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"ltv-row\" style=\"--c:#fb7185\">\n        <span class=\"lbl\">⚠ En riesgo<\u002Fspan>\n        <div class=\"bar\"><div class=\"fill\" style=\"width:42%\"><\u002Fdiv><\u002Fdiv>\n        <span class=\"v\">$3.2k<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  `;\n\n      // ───── Retention heatmap ─────\n      const cohorts = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun'];\n      const months = ['M0', 'M1', 'M2', 'M3', 'M4', 'M5'];\n      const heatData = cohorts.map((co, i) => months.map((m, j) => {\n        if (j > 5 - i) return null; // not yet measured\n        if (j === 0) return 100;\n        const base = 100 - j * 12 - i * 2 + Math.sin(i + j) * 4;\n        return Math.max(28, Math.min(100, Math.round(base)));\n      }));\n      document.getElementById('heat-wrap').innerHTML = `\n    <div class=\"heat\">\n      <div><\u002Fdiv>\n      ${months.map(m => `<div class=\"h-th\">${m}<\u002Fdiv>`).join('')}\n      ${cohorts.map((co, i) => `\n        <div class=\"h-row\">\n          <div class=\"cohort\">${co} <span style=\"color:var(--ink-faint);margin-left:4px\">${28 + i * 8}<\u002Fspan><\u002Fdiv>\n          ${months.map((m, j) => {\n        const v = heatData[i][j];\n        if (v === null) return `<div class=\"cell empty\">—<\u002Fdiv>`;\n        return `<div class=\"cell\" style=\"--p:${v}\">${v}%<\u002Fdiv>`;\n      }).join('')}\n        <\u002Fdiv>\n      `).join('')}\n    <\u002Fdiv>\n  `;\n\n      // ───── Zones ─────\n      const zonesAgg = {};\n      CUSTOMERS.forEach(c => { zonesAgg[c.zone] = (zonesAgg[c.zone] || 0) + 1; });\n      const zoneList = Object.entries(zonesAgg).sort((a, b) => b[1] - a[1]).slice(0, 8);\n      const zoneColors = ['#5eead4', '#fb923c', '#86efac', '#fbbf24', '#f9a8d4', '#93c5fd', '#c79bff', '#7dd3fc'];\n      document.getElementById('zone-grid').innerHTML = zoneList.map(([z, n], i) => `\n    <div class=\"zone-card\" style=\"--c:${zoneColors[i % zoneColors.length]}\">\n      <div class=\"n\">${z}<\u002Fdiv>\n      <div class=\"v\">${n}<\u002Fdiv>\n      <div class=\"m\">clientes<\u002Fdiv>\n    <\u002Fdiv>\n  `).join('');\n    }\n\n    function openCustomer(id) {\n      const c = CUSTOMERS.find(x => x.id === id); if (!c) return;\n      let h = 0; for (const ch of c.name) h = (h * 31 + ch.charCodeAt(0)) % 360;\n      const tierLabel = c.tier === 'res' ? '🏠 Residencial' : c.tier === 'com' ? '🏢 Comercial' : '⭐ Premium';\n\n      // their tickets\n      const theirs = TICKETS.filter(t => t.cliente === c.name);\n\n      let drawer = document.getElementById('customer-drawer');\n      if (!drawer) {\n        const overlay = document.createElement('div'); overlay.className = 'drawer-overlay'; overlay.id = 'customer-overlay'; document.body.appendChild(overlay);\n        drawer = document.createElement('div'); drawer.className = 'drawer'; drawer.id = 'customer-drawer'; document.body.appendChild(drawer);\n        overlay.addEventListener('click', closeCustomer);\n      }\n      drawer.innerHTML = `\n    <div class=\"drawer-head\">\n      <div class=\"ax\" style=\"background:linear-gradient(135deg,hsl(${h},70%,72%),hsl(${(h + 45) % 360},70%,72%))\">${c.name.split(' ').map(s => s[0]).slice(0, 2).join('')}<\u002Fdiv>\n      <div class=\"info\">\n        <div class=\"nm\">${c.name}<\u002Fdiv>\n        <div class=\"m\">${c.email} · ${c.phone}<\u002Fdiv>\n      <\u002Fdiv>\n      <button class=\"drawer-close\" id=\"drawer-close\">✕<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"drawer-body\">\n      <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n        <span class=\"cli-tag tier-${c.tier}\">${tierLabel}<\u002Fspan>\n        <span class=\"cli-tag tier-res\" style=\"--c:#a4a8b6\">${c.zone}<\u002Fspan>\n        ${c.rec ? '<span class=\"cli-tag tier-res\" style=\"--c:#86efac\">↻ Recurrente<\u002Fspan>' : ''}\n        ${c.newish ? '<span class=\"cli-tag tier-res\" style=\"--c:#c79bff\">✦ Nuevo 30d<\u002Fspan>' : ''}\n      <\u002Fdiv>\n\n      <div class=\"drawer-stats\">\n        <div class=\"drawer-stat\"><div class=\"l\">Servicios<\u002Fdiv><div class=\"v\">${c.services}<\u002Fdiv><\u002Fdiv>\n        <div class=\"drawer-stat\"><div class=\"l\">LTV<\u002Fdiv><div class=\"v\" style=\"color:var(--c-quote)\">$${(c.ltv / 1000).toFixed(1)}k<\u002Fdiv><\u002Fdiv>\n        <div class=\"drawer-stat\"><div class=\"l\">NPS<\u002Fdiv><div class=\"v\" style=\"color:${c.nps >= 9 ? 'var(--c-done)' : 'var(--c-check)'}\">${c.nps || '—'}<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div>\n        <div style=\"font-family:Outfit,sans-serif;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:10px\">Datos de contacto<\u002Fdiv>\n        <div class=\"info-card\">\n          <div class=\"kv\"><span class=\"k\">Teléfono<\u002Fspan><span class=\"v\" style=\"font-family:Outfit,sans-serif;font-size:11.5px\">${c.phone}<\u002Fspan><\u002Fdiv>\n          <div class=\"kv\"><span class=\"k\">Email<\u002Fspan><span class=\"v\" style=\"font-family:Outfit,sans-serif;font-size:11.5px\">${c.email}<\u002Fspan><\u002Fdiv>\n          <div class=\"kv\"><span class=\"k\">Zona<\u002Fspan><span class=\"v\">${c.zone}<\u002Fspan><\u002Fdiv>\n          <div class=\"kv\"><span class=\"k\">Cliente desde<\u002Fspan><span class=\"v\">${c.since}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div>\n        <div style=\"font-family:Outfit,sans-serif;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:10px\">Historial de tickets · ${theirs.length}<\u002Fdiv>\n        ${theirs.length ? theirs.map(t => {\n        const s = SERVICES[t.svc]; const ph = PHASES.find(p => p.id === t.fase);\n        return `<div class=\"info-card\" style=\"--c:${ph.color};cursor:pointer;margin-bottom:8px\" onclick=\"document.querySelector('.drawer-close').click(); activeChatId='${t.id}'; switchView('conversaciones')\">\n            <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px\">\n              <div>\n                <div style=\"font-size:13.5px;font-weight:500\">${s.em} ${s.label} <span style=\"font-family:Outfit,sans-serif;font-size:10px;color:var(--ink-faint);margin-left:4px\">#${t.id.split('-')[1]}<\u002Fspan><\u002Fdiv>\n                <div style=\"font-size:11px;color:var(--ink-dim);margin-top:3px\">${t.ubic} · ${t.urg === 'emg' ? '🚨 Emergencia' : t.urg === 'day' ? '📅 Mismo día' : '⏱️ Normal'}<\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"font-family:Outfit,sans-serif;font-size:11px;color:${ph.color};white-space:nowrap\">${ph.short}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;font-size:11px;color:var(--ink-faint);font-family:Outfit,sans-serif\">\n              <span>${t.iniciado}<\u002Fspan>\n              <span style=\"color:var(--ink);font-weight:600\">${t.monto ? '$' + t.monto.toLocaleString() : '—'}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>`;\n      }).join('') : '<div class=\"info-card empty\">Sin tickets todavía.<\u002Fdiv>'}\n      <\u002Fdiv>\n\n      <div class=\"info-actions\">\n        <button class=\"advance\">＋ Crear nuevo ticket<\u002Fbutton>\n        <button id=\"cust-msg\">✉ Enviar mensaje<\u002Fbutton>\n        <button>📞 Llamar<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  `;\n      document.getElementById('drawer-close').onclick = closeCustomer;\n      document.getElementById('cust-msg').onclick = () => {\n        if (theirs.length) {\n          closeCustomer();\n          activeChatId = theirs[0].id;\n          switchView('conversaciones');\n          toast('Conversación abierta · ' + c.name);\n        } else {\n          toast('Este cliente no tiene tickets para conversar');\n        }\n      };\n      document.getElementById('customer-overlay').classList.add('is-open');\n      drawer.classList.add('is-open');\n    }\n    function closeCustomer() {\n      const d = document.getElementById('customer-drawer'); if (d) d.classList.remove('is-open');\n      const o = document.getElementById('customer-overlay'); if (o) o.classList.remove('is-open');\n    }\n\n    /* ───── SERVICIOS ───── */\n    function renderServicios() {\n      const t30 = TICKETS.length;\n      document.getElementById('svc-grid').innerHTML = Object.entries(SERVICES).map(([k, s]) => {\n        const p = PRICES[k];\n        return `<div class=\"svc-card\" style=\"--c:${s.color}\">\n      <div class=\"top\">\n        <div class=\"em\">${s.em}<\u002Fdiv>\n        <div><div class=\"ttl\">${s.label}<\u002Fdiv><div class=\"sub\">Base + materiales<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"price\">$${p.base.toLocaleString()}<small>MXN · base<\u002Fsmall><\u002Fdiv>\n      <div class=\"mini\">\n        <div class=\"ki\"><div class=\"k\">Duración prom.<\u002Fdiv><div class=\"v\">${p.dur}<\u002Fdiv><\u002Fdiv>\n        <div class=\"ki\"><div class=\"k\">Servicios mes<\u002Fdiv><div class=\"v\">${p.m}<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n      }).join('');\n      document.querySelectorAll('#svc-grid .svc-card').forEach((el, i) => el.addEventListener('click', () => toast('Editor de servicio próximamente · ' + Object.values(SERVICES)[i].label)));\n    }\n\n    /* ───── FICHAS TÉCNICAS · PDF GENERATOR ───── */\n    const SVC_MATERIALS = {\n      plomeria: [{ n: 'Tubo PVC 1/2\"', p: 42, s: '48 pzas' }, { n: 'Cinta de teflón', p: 18, s: '120 rollos' }, { n: 'Codo PVC 90°', p: 12, s: '200 pzas' }],\n      electrica: [{ n: 'Centro de carga 8 polos', p: 1840, s: '12 pzas' }, { n: 'Cable THW cal. 12 (m)', p: 14, s: '400 m' }, { n: 'Pastilla termomagnética', p: 95, s: '60 pzas' }],\n      cerrajeria: [{ n: 'Cerradura digital DLK-200', p: 2200, s: '6 pzas' }, { n: 'Juego de pines', p: 140, s: '30 sets' }, { n: 'Llave de repuesto', p: 35, s: '150 pzas' }],\n      jardineria: [{ n: 'Fertilizante granulado 25kg', p: 320, s: '18 sacos' }, { n: 'Tierra de hoja 50L', p: 95, s: '40 bolsas' }, { n: 'Semilla de pasto (kg)', p: 180, s: '25 kg' }],\n      hogar: [{ n: 'Kit de fijación universal', p: 65, s: '80 pzas' }, { n: 'Silicón sellador', p: 48, s: '90 pzas' }, { n: 'Foco LED 9W', p: 38, s: '200 pzas' }],\n      albanil: [{ n: 'Pintura vinílica 19L', p: 890, s: '22 cubetas' }, { n: 'Cemento gris 50kg', p: 215, s: '60 sacos' }, { n: 'Mortero adhesivo', p: 165, s: '45 sacos' }],\n    };\n    const URG_MULT = [{ n: 'Normal', d: '3–5 días hábiles', m: 1.00 }, { n: 'Mismo día', d: '2–4 horas', m: 1.30 }, { n: 'Emergencia 24/7', d: '< 1 hora', m: 1.80 }];\n    const LOC_MULT = [{ n: 'Residencial', m: 1.00 }, { n: 'Comercial', m: 1.15 }, { n: 'Premium / Hotel', m: 1.35 }];\n\n    function generateServiceSheets() {\n      const money = n => '$' + Math.round(n).toLocaleString('es-MX');\n      const fecha = new Date().toLocaleDateString('es-MX', { day: '2-digit', month: 'long', year: 'numeric' });\n\n      const pages = Object.entries(SERVICES).map(([k, s], idx) => {\n        const p = PRICES[k];\n        const mats = SVC_MATERIALS[k] || [];\n        const urgRows = URG_MULT.map(u => `<tr><td>${u.n}<\u002Ftd><td class=\"muted\">${u.d}<\u002Ftd><td class=\"mult\">×${u.m.toFixed(2)}<\u002Ftd><td class=\"num\">${money(p.base * u.m)}<\u002Ftd><\u002Ftr>`).join('');\n        const locRows = LOC_MULT.map(l => `<tr><td>${l.n}<\u002Ftd><td class=\"mult\">×${l.m.toFixed(2)}<\u002Ftd><td class=\"num\">${money(p.base * l.m)}<\u002Ftd><\u002Ftr>`).join('');\n        const matRows = mats.map(m => `<tr><td>${m.n}<\u002Ftd><td class=\"muted\">${m.s}<\u002Ftd><td class=\"num\">${money(m.p)}<\u002Ftd><\u002Ftr>`).join('');\n        const phases = PHASES.map((ph, i) => `<span class=\"phase\">${i + 1}. ${ph.name}<\u002Fspan>`).join('<span class=\"arrow\">→<\u002Fspan>');\n        return `<section class=\"sheet${idx === Object.keys(SERVICES).length - 1 ? ' last' : ''}\" style=\"--c:${s.color}\">\n          <header class=\"sheet-head\">\n            <div class=\"brand\">YESSYFY <span class=\"bdot\">·<\u002Fspan> <i>Ficha técnica de servicio<\u002Fi><\u002Fdiv>\n            <div class=\"doc\">Catálogo 2026 · ${idx + 1}/${Object.keys(SERVICES).length}<\u002Fdiv>\n          <\u002Fheader>\n          <div class=\"accent\"><\u002Fdiv>\n          <div class=\"title\">\n            <div class=\"em\">${s.em}<\u002Fdiv>\n            <div>\n              <h1>${s.label}<\u002Fh1>\n              <p>Precio base + materiales · tarifas calculadas por urgencia y tipo de ubicación.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"stats\">\n            <div class=\"stat\"><div class=\"l\">Precio base<\u002Fdiv><div class=\"v\">${money(p.base)}<small>MXN<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n            <div class=\"stat\"><div class=\"l\">Duración prom.<\u002Fdiv><div class=\"v\">${p.dur}<\u002Fdiv><\u002Fdiv>\n            <div class=\"stat\"><div class=\"l\">Servicios / mes<\u002Fdiv><div class=\"v\">${p.m}<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"cols\">\n            <div class=\"block\">\n              <h2>Tarifa por urgencia<\u002Fh2>\n              <table><thead><tr><th>Tipo<\u002Fth><th>Respuesta<\u002Fth><th class=\"rt\">×<\u002Fth><th class=\"rt\">Total<\u002Fth><\u002Ftr><\u002Fthead><tbody>${urgRows}<\u002Ftbody><\u002Ftable>\n            <\u002Fdiv>\n            <div class=\"block\">\n              <h2>Tarifa por ubicación<\u002Fh2>\n              <table><thead><tr><th>Tipo<\u002Fth><th class=\"rt\">×<\u002Fth><th class=\"rt\">Total<\u002Fth><\u002Ftr><\u002Fthead><tbody>${locRows}<\u002Ftbody><\u002Ftable>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"block\">\n            <h2>Materiales y consumibles frecuentes<\u002Fh2>\n            <table><thead><tr><th>Material<\u002Fth><th>Stock<\u002Fth><th class=\"rt\">Precio unitario<\u002Fth><\u002Ftr><\u002Fthead><tbody>${matRows}<\u002Ftbody><\u002Ftable>\n          <\u002Fdiv>\n          <div class=\"block flow\">\n            <h2>Flujo de atención · 8 fases<\u002Fh2>\n            <div class=\"phases\">${phases}<\u002Fdiv>\n          <\u002Fdiv>\n          <footer class=\"sheet-foot\">Generado el ${fecha} · YESSYFY Admin · Documento interno — no distribuir<\u002Ffooter>\n        <\u002Fsection>`;\n      }).join('');\n\n      const doc = `<!DOCTYPE html><html lang=\"es\"><head><meta charset=\"UTF-8\">\n        <title>YESSYFY · Fichas técnicas de servicios<\u002Ftitle>\n        <style>\n          @page { size: A4; margin: 14mm; }\n          * { margin:0; padding:0; box-sizing:border-box; }\n          body { font-family: 'Outfit', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; color:#0d2b2c; -webkit-print-color-adjust:exact; print-color-adjust:exact; }\n          .sheet { page-break-after: always; padding-bottom: 8px; }\n          .sheet.last { page-break-after: auto; }\n          .sheet-head { display:flex; justify-content:space-between; align-items:baseline; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:#5d8585; }\n          .brand { font-weight:700; color:#0a3d40; letter-spacing:.16em; }\n          .brand i { font-weight:400; font-style:italic; text-transform:none; letter-spacing:.02em; color:#5d8585; }\n          .bdot { color:var(--c); }\n          .accent { height:5px; border-radius:4px; background:var(--c); margin:10px 0 18px; }\n          .title { display:flex; align-items:center; gap:16px; margin-bottom:20px; }\n          .title .em { font-size:40px; line-height:1; width:62px; height:62px; display:flex; align-items:center; justify-content:center; border-radius:14px; background:color-mix(in srgb, var(--c) 16%, white); }\n          .title h1 { font-size:30px; font-weight:600; letter-spacing:-.01em; color:#0a3d40; }\n          .title p { font-size:11.5px; color:#5d8585; margin-top:3px; max-width:54ch; }\n          .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:22px; }\n          .stat { border:1px solid #d8e6e5; border-radius:11px; padding:13px 15px; }\n          .stat .l { font-size:9px; letter-spacing:.13em; text-transform:uppercase; color:#7da3a3; }\n          .stat .v { font-size:22px; font-weight:700; color:#0a3d40; margin-top:5px; }\n          .stat .v small { font-size:10px; font-weight:500; color:#7da3a3; margin-left:4px; }\n          .cols { display:grid; grid-template-columns:1fr 1fr; gap:18px; }\n          .block { margin-bottom:18px; }\n          .block h2 { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--c); filter:brightness(.65) saturate(1.3); margin-bottom:8px; font-weight:700; }\n          table { width:100%; border-collapse:collapse; font-size:11.5px; }\n          th { text-align:left; font-size:8.5px; letter-spacing:.1em; text-transform:uppercase; color:#9ab; font-weight:600; padding:0 0 6px; border-bottom:1px solid #e3eeed; }\n          td { padding:7px 0; border-bottom:1px solid #eef5f4; color:#244; }\n          td.muted { color:#7da3a3; }\n          th.rt, td.num, td.mult { text-align:right; }\n          td.num { font-weight:700; color:#0a3d40; }\n          td.mult { color:#5d8585; font-variant-numeric:tabular-nums; }\n          .flow .phases { display:flex; flex-wrap:wrap; align-items:center; gap:5px; }\n          .phase { font-size:10.5px; font-weight:600; color:#0a3d40; background:#eef6f5; border:1px solid #d8e6e5; border-radius:20px; padding:5px 11px; }\n          .arrow { color:var(--c); font-weight:700; font-size:11px; }\n          .sheet-foot { margin-top:14px; padding-top:10px; border-top:1px solid #e3eeed; font-size:9px; letter-spacing:.05em; color:#9ab; }\n        <\u002Fstyle><\u002Fhead><body>${pages}<\u002Fbody><\u002Fhtml>`;\n\n      const old = document.getElementById('svc-pdf-frame');\n      if (old) old.remove();\n      const iframe = document.createElement('iframe');\n      iframe.id = 'svc-pdf-frame';\n      iframe.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;opacity:0;';\n      document.body.appendChild(iframe);\n      const fd = iframe.contentWindow.document;\n      fd.open(); fd.write(doc); fd.close();\n      const fire = () => {\n        try { iframe.contentWindow.focus(); iframe.contentWindow.print(); } catch (e) { }\n      };\n      iframe.contentWindow.onafterprint = () => setTimeout(() => iframe.remove(), 300);\n      // give fonts/layout a beat, then open the print dialog\n      setTimeout(fire, 450);\n      toast('Generando fichas PDF · usa “Guardar como PDF” en el diálogo');\n    }\n\n    /* ───── REPORTES ───── */\n    let repRange = 30;\n    function renderReportes() {\n      // KPIs\n      const total = TICKETS.reduce((a, b) => a + (b.monto || 0), 0);\n      const completados = TICKETS.filter(t => t.fase >= 7).length;\n      document.getElementById('rep-kpis').innerHTML = `\n    <div class=\"kpi c-mint\"><div class=\"lbl\"><span class=\"ic\">$<\u002Fspan> Ingresos · ${repRange}d<\u002Fdiv><div class=\"v\">$${(total * 30 / repRange / 1000).toFixed(1)}k<\u002Fdiv><div class=\"delta up\">▲ +12.4%<\u002Fdiv><\u002Fdiv>\n    <div class=\"kpi c-blue\"><div class=\"lbl\"><span class=\"ic\">✸<\u002Fspan> Servicios completados<\u002Fdiv><div class=\"v\">${completados * Math.round(repRange / 3)}<\u002Fdiv><div class=\"delta up\">+18%<\u002Fdiv><\u002Fdiv>\n    <div class=\"kpi c-cyan\"><div class=\"lbl\"><span class=\"ic\">⏱<\u002Fspan> Tiempo de cierre<\u002Fdiv><div class=\"v\">1.8<small>horas<\u002Fsmall><\u002Fdiv><div class=\"delta down\">▼ -8%<\u002Fdiv><\u002Fdiv>\n    <div class=\"kpi c-amber\"><div class=\"lbl\"><span class=\"ic\">%<\u002Fspan> Conversión<\u002Fdiv><div class=\"v\">68<small>%<\u002Fsmall><\u002Fdiv><div class=\"delta up\">+3.1pp<\u002Fdiv><\u002Fdiv>\n    <div class=\"kpi c-pink\"><div cl 002Fspan><\u002Ftd>\n      <td style=\"text-align:right\"><span class=\"price\">${t.monto ? '$' + t.monto.toLocaleString() : '—'}<\u002Fspan><\u002Ftd>\n    <\u002Ftr>`;\n      }).join('');\n      tbody.querySelectorAll('tr').forEach(tr => tr.addEventListener('click', () => openTicket(tr.dataset.id)));\n    }\n\n    /* ───── FACTURACIÓN ───── */\n    function renderFacturacion() {\n      document.getElementById('fact-kpis').innerHTML = `\n    <div class=\"kpi c-mint\"><div class=\"lbl\"><span class=\"ic\">⛬<\u002Fspan> CFDI emitidas · mes<\u002Fdiv><div class=\"v\">186<\u002Fdiv><div class=\"delta up\">▲ +22%<\u002Fdiv><\u002Fdiv>\n    <div class=\"kpi c-amber\"><div class=\"lbl\"><span class=\"ic\">⏳<\u002Fspan> Pendientes<\u002Fdiv><div class=\"v\">14<\u002Fdiv><div class=\"delta flat\">esperan datos fiscales<\u002Fdiv><\u002Fdiv>\n    <div class=\"kpi c-pink\"><div class=\"lbl\"><span class=\"ic\">✕<\u002Fspan> Canceladas<\u002Fdiv><div class=\"v\">3<\u002Fdiv><div class=\"delta down\">2 con sustitución<\u002Fdiv><\u002Fdiv>\n    <div class=\"kpi c-blue\"><div class=\"lbl\"><span class=\"ic\">$<\u002Fspan> Total facturado<\u002Fdiv><div class=\"v\">$248k<\u002Fdiv><div class=\"delta up\">+15%<\u002Fdiv><\u002Fdiv>\n    <div class=\"kpi c-cyan\"><div class=\"lbl\"><span class=\"ic\">▦<\u002Fspan> Sellos restantes<\u002Fdiv><div class=\"v\">384<small>/ 500<\u002Fsmall><\u002Fdiv><div class=\"delta flat\">renovar en 14d<\u002Fdiv><\u002Fdiv>\n  `;\n      const facturas = TICKETS.filter(t => t.fase === 8).map((t, i) => ({\n        folio: `A-${String(2024100 + i).padStart(6, '0')}`,\n        cliente: t.cliente,\n        rfc: t.cliente.split(' ').map(s => s[0]).join('') + (i + 800),\n        ticket: t.id,\n        estado: i === 0 ? 'emitida' : 'emitida',\n        fecha: t.iniciado,\n        monto: t.monto || 0,\n      }));\n      // pad with extra fake invoices\n      const extras = [\n        { folio: 'A-2024073', cliente: 'Carlos Hidalgo', rfc: 'HIHO850923K12', ticket: '2024-1230', estado: 'emitida', fecha: '21/05', monto: 2450 },\n        { folio: 'A-2024072', cliente: 'Hotel Real Maya', rfc: 'HRM230114Q88', ticket: '2024-1228', estado: 'pendiente', fecha: '21/05', monto: 8200 },\n        { folio: 'A-2024071', cliente: 'Spa Aurora', rfc: 'SAU220505NK1', ticket: '2024-1225', estado: 'emitida', fecha: '20/05', monto: 1600 },\n        { folio: 'A-2024070', cliente: 'Andrés Sosa', rfc: 'SOAA901001LU8', ticket: '2024-1220', estado: 'cancelada', fecha: '19/05', monto: 1240 },\n      ];\n      const all = facturas.concat(extras);\n      const tbody = document.querySelector('#fact-tbl tbody');\n      tbody.innerHTML = all.map(f => {\n        const stcolor = f.estado === 'emitida' ? 'var(--c-done)' : f.estado === 'pendiente' ? 'var(--c-check)' : 'var(--c-error)';\n        return `<tr>\n      <td style=\"font-family:Outfit,sans-serif;font-size:11.5px;color:var(--ink-dim)\">${f.folio}<\u002Ftd>\n      <td><div style=\"font-size:12.5px\">${f.cliente}<\u002Fdiv><div style=\"font-size:10.5px;color:var(--ink-faint);font-family:Outfit,sans-serif\">${f.rfc}<\u002Fdiv><\u002Ftd>\n      <td style=\"font-family:Outfit,sans-serif;font-size:11.5px\">#${f.ticket.split('-')[1]}<\u002Ftd>\n      <td><span style=\"font-family:Outfit,sans-serif;font-size:10px;padding:3px 8px;border-radius:4px;letter-spacing:.05em;color:${stcolor};background:color-mix(in oklab,${stcolor} 14%,transparent);text-transform:capitalize\">${f.estado}<\u002Fspan><\u002Ftd>\n      <td style=\"font-family:Outfit,sans-serif;font-size:11.5px;color:var(--ink-dim)\">${f.fecha}<\u002Ftd>\n      <td style=\"text-align:right\"><span class=\"price\">$${f.monto.toLocaleString()}<\u002Fspan><\u002Ftd>\n    <\u002Ftr>`;\n      }).join('');\n    }\n\n    /* ───── SETTINGS ───── */\n    function wireSettings() {\n      document.querySelectorAll('.toggle[data-toggle]').forEach(t => {\n        t.onclick = () => { t.classList.toggle('is-on'); toast('Configuración actualizada'); };\n      });\n      const save = document.getElementById('set-save');\n      if (save) save.onclick = () => toast('Cambios guardados ✓');\n    }\n\n    /* ───── filters & buttons wiring ───── */\n    function wireCatalogFilters() {\n      document.querySelectorAll('#cli-filters [data-tier]').forEach(p => p.addEventListener('click', () => {\n        document.querySelectorAll('#cli-filters [data-tier]').forEach(x => x.classList.remove('is-on'));\n        p.classList.add('is-on'); cliFilters.tier = p.dataset.tier; renderClientes();\n      }));\n      document.querySelectorAll('#cli-filters [data-rec]').forEach(p => p.addEventListener('click', () => {\n        document.querySelectorAll('#cli-filters [data-rec]').forEach(x => x.classList.remove('is-on'));\n        p.classList.add('is-on'); cliFilters.rec = p.dataset.rec; renderClientes();\n      }));\n      document.querySelectorAll('#rep-range button').forEach(b => b.addEventListener('click', () => {\n        document.querySelectorAll('#rep-range button').forEach(x => x.classList.remove('is-on'));\n        b.classList.add('is-on'); repRange = parseInt(b.dataset.r); renderReportes();\n      }));\n      const repCsv = document.getElementById('rep-csv'); if (repCsv) repCsv.onclick = () => toast('Exportando CSV…');\n      const repPdf = document.getElementById('rep-pdf'); if (repPdf) repPdf.onclick = () => toast('Generando PDF…');\n      const svcPdf = document.getElementById('svc-pdf'); if (svcPdf) svcPdf.onclick = generateServiceSheets;\n      const calPrev = document.getElementById('cal-prev'); if (calPrev) calPrev.onclick = () => { calOffset--; renderCalendario(); };\n      const calNext = document.getElementById('cal-next'); if (calNext) calNext.onclick = () => { calOffset++; renderCalendario(); };\n      const calToday = document.getElementById('cal-today'); if (calToday) calToday.onclick = () => { calOffset = 0; renderCalendario(); };\n      const newCli = document.getElementById('new-client-btn'); if (newCli) newCli.onclick = () => toast('Form de alta de cliente próximamente');\n\n      // Colaboradores events\n      const colSearch = document.getElementById('col-search'); if (colSearch) colSearch.addEventListener('input', e => renderColList(e.target.value));\n      const phTabs = document.querySelectorAll('#ph-tabs .tab'); phTabs.forEach(t => t.addEventListener('click', () => { phoneTab = t.dataset.tab; renderPhone(); }));\n      const phBack = document.getElementById('phone-back'); if (phBack) phBack.onclick = () => { phoneTab = 'inicio'; renderPhone(); };\n      const newCol = document.getElementById('new-col-btn'); if (newCol) newCol.onclick = () => toast('Form de alta de colaborador próximamente');\n    }\n\n    /* ───── boot ───── */\n    loadState();\n    if (NOTIFS.length === 0) {\n      NOTIFS.push(\n        { id: Date.now() + 1, kind: 'alert', title: 'Ticket 2024-1245 sin colaborador asignado', meta: '#2024-1245 · 🔐 Cerrajería · Hotel Real Maya', time: '14:42', read: false, color: 'var(--c-error)', icon: '!', ticketId: '2024-1245' },\n        { id: Date.now() + 2, kind: 'collab', title: 'Juan García cambió estado a /en_proceso', meta: '#2024-1247 · Mariana Cervantes', time: '14:51', read: false, color: 'var(--c-work)', icon: '⚒', ticketId: '2024-1247' },\n        { id: Date.now() + 3, kind: 'phase', title: 'Carlos Hidalgo avanzó a Pago', meta: '#2024-1246 · ⚡ Eléctrica', time: '14:38', read: false, color: 'var(--c-pay)', icon: '▶', ticketId: '2024-1246' },\n        { id: Date.now() + 4, kind: 'new', title: 'Nuevo chat iniciado', meta: '#2024-1240 · Enrique Vela', time: '14:51', read: true, color: 'var(--c-quote)', icon: '✦', ticketId: '2024-1240' },\n      );\n    }\n    renderNotifs();\n    renderKPIs(); renderPipeline(); renderTickets(); renderDonut(); renderProviders(); renderFunnel();\n\n    document.getElementById('notif-btn').addEventListener('click', e => { e.stopPropagation(); toggleNotifs(); });\n    document.getElementById('notif-mark').addEventListener('click', () => { NOTIFS.forEach(n => n.read = true); renderNotifs(); saveState(); });\n    document.getElementById('notif-clear').addEventListener('click', () => { NOTIFS.length = 0; renderNotifs(); saveState(); toast('Notificaciones limpiadas'); });\n\n    wireCatalogFilters();\n\n    document.querySelectorAll('#range-seg button').forEach(b => b.addEventListener('click', () => {\n      document.querySelectorAll('#range-seg button').forEach(x => x.classList.remove('is-on'));\n      b.classList.add('is-on');\n      toast('Rango: ' + b.textContent);\n    }));\n\n    document.querySelectorAll('.nav-item[data-view]').forEach(n => n.addEventListener('click', () => switchView(n.dataset.view)));\n\n    /* workspace tab switching (Conversación / Mapa & detalles) */\n    document.querySelectorAll('.ws-tab').forEach(b => b.addEventListener('click', () => setWsTab(b.dataset.wtab)));\n\n    /* search filter (top bar) */\n    document.querySelector('.topbar .search input').addEventListener('input', (e) => {\n      const q = e.target.value.toLowerCase();\n\n      // if in colaboradores view, update the local search\n      const colSearch = document.getElementById('col-search');\n      if (colSearch && document.querySelector('[data-page=\"colaboradores\"]').classList.contains('is-on')) {\n        colSearch.value = e.target.value;\n        renderColList(q);\n      }\n\n      if (!q) { renderTicketsFull(); renderTickets(); return; }\n      const filtered = TICKETS.filter(t => t.cliente.toLowerCase().includes(q) || t.id.includes(q) || t.email.toLowerCase().includes(q));\n      // light filter on visible tables\n      const apply = (sel) => {\n        document.querySelectorAll(sel + ' tbody tr[data-id]').forEach(tr => {\n          tr.style.display = filtered.find(t => t.id === tr.dataset.id) ? '' : 'none';\n        });\n      };\n      apply('#tickets-tbl'); apply('#tickets-tbl-full');\n    });\n\n    /* tickets filters */\n    document.querySelectorAll('#tk-filters [data-filter]').forEach(p => p.addEventListener('click', () => {\n      document.querySelectorAll('#tk-filters [data-filter]').forEach(x => x.classList.remove('is-on'));\n      p.classList.add('is-on');\n      tkFilters.urg = p.dataset.filter;\n      renderTicketsFull();\n    }));\n    document.querySelectorAll('#tk-filters [data-svc]').forEach(p => p.addEventListener('click', () => {\n      if (p.style.color === 'var(--ink-faint)') return; // label\n      document.querySelectorAll('#tk-filters [data-svc]').forEach(x => { if (x.style.color !== 'var(--ink-faint)') x.classList.remove('is-on'); });\n      p.classList.add('is-on');\n      tkFilters.svc = p.dataset.svc;\n      renderTicketsFull();\n    }));\n\n    /* conversations search */\n    document.getElementById('conv-search').addEventListener('input', (e) => renderChatList(e.target.value));\n\n    /* new ticket buttons */\n    document.querySelector('.btn-primary').addEventListener('click', openNewTicket);\n    const ntBtn = document.getElementById('new-ticket-btn'); if (ntBtn) ntBtn.addEventListener('click', openNewTicket);\n\n    /* keyboard shortcut for search */\n    document.addEventListener('keydown', e => {\n      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); document.querySelector('.topbar .search input').focus(); }\n    });\n\n    /* clock ticker for phone view */\n    setInterval(() => {\n      const timeEl = document.getElementById('ph-time');\n      if (timeEl) timeEl.textContent = new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', hour12: false });\n    }, 30000);\n  <\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
